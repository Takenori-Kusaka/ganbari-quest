name: Deploy to AWS (Production)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'static/**'
      - 'package.json'
      - 'package-lock.json'
      - 'svelte.config.js'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'Dockerfile*'
      - 'infra/**'
      - 'drizzle/**'
      - 'scripts/**'
      # #2097 hotfix #7: deploy.yml 自身の変更でも deploy が走るようにする
      # (PR #2133 で発覚: deploy.yml 単独 PR は trigger されずに demo Lambda 反映遅延)
      - '.github/workflows/deploy.yml'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ganbari-quest
  LAMBDA_FUNCTION: ganbari-quest-app
  DOMAIN_NAME: ganbari-quest.com
  CERTIFICATE_ARN: arn:aws:acm:us-east-1:443370718249:certificate/a278b058-8798-4793-ba1f-3f3de2a0b837
  APP_MAJOR_VERSION: "1"

jobs:
  # #1277: pre-deploy の test-lint / test-e2e / test-cognito / test-gate は
  # ci.yml (PR CI) と完全重複しており、flaky が 2 回走って main が詰まる温床だった。
  # - PR merge 前: ci.yml が Branch ruleset の required_status_checks で強制
  # - PR merge 後: deploy.yml は build + deploy + health-check のみ
  # - 本番稼働確認: e2e-production (post-deploy smoke on Lambda URL) が担う
  # - 障害時: Rollback on failure step が previous image に戻す
  # 歴史的インシデント: #911 / #967 / #1084 / #1097 / #1277

  deploy:
    runs-on: ubuntu-24.04-arm
    environment: production
    outputs:
      version: ${{ steps.version.outputs.version }}
      image-tag: ${{ steps.version.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "image-tag=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is-release=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="dev-$(echo ${{ github.sha }} | cut -c1-7)"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "image-tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "is-release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Deploying version: $VERSION"

      # #1586: 本番デプロイに必須の GitHub Secrets が登録されているかを deploy 前に検証する。
      # - OPS_SECRET_KEY: cron-dispatcher の Bearer 認証 fallback (CRON_SECRET 未登録時)
      # - AWS_OIDC_IAMROLE_ARN: AWS 認証
      # - STRIPE_SECRET_KEY: Stripe 課金
      # 欠落するとサイレントに secret 注入が抜けて本番で fail するため、CI 段階で hard-fail させる。
      # Epic #2525 Phase 7 PR-L5 (#2860): AWS_LICENSE_SECRET は license key 全廃 contract で撤去済。
      - name: Validate required secrets
        env:
          OPS_SECRET_KEY: ${{ secrets.OPS_SECRET_KEY }}
          AWS_OIDC_IAMROLE_ARN: ${{ secrets.AWS_OIDC_IAMROLE_ARN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          # #2310 / #2337 / ADR-0050: parent-gate-session.ts が production で必須要求。
          # 未注入だと /admin/* cold start で throw して 500 連発 (PR #2325 で実害発生)。
          PARENT_GATE_COOKIE_SECRET: ${{ secrets.PARENT_GATE_COOKIE_SECRET }}
          # #4280: CloudFront -> origin の front door header。未登録だと CDK synth が throw して
          # deploy が止まる (header 無しの distribution = Function URL 直叩きで /admin ・ /ops に
          # 到達可能なまま黙って動く、を作らせない)。ここで先に落として原因を明示する。
          ORIGIN_VERIFY_SECRET: ${{ secrets.ORIGIN_VERIFY_SECRET }}
        run: |
          missing=0
          for s in OPS_SECRET_KEY AWS_OIDC_IAMROLE_ARN STRIPE_SECRET_KEY PARENT_GATE_COOKIE_SECRET ORIGIN_VERIFY_SECRET; do
            val=$(eval echo "\$$s")
            if [ -z "$val" ]; then
              echo "::error::Required GitHub Secret '$s' is missing. Register via 'gh secret set $s --body <value>'"
              missing=$((missing + 1))
            else
              echo "::notice::Required secret '$s' is set"
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "::error::$missing required secret(s) missing — aborting deploy (#1586)"
            exit 1
          fi
          # #4104: 本番に test key が入る事故は単体で成立し、しかも無通知で成立する
          # (顧客の決済がすべて test mode に流れ、決済成功に見えたまま入金されない)。
          # staging の逆方向と対称に allowlist で止める。denylist (sk_test_ を弾く) だと
          # 将来 Stripe が prefix を増やしたとき黙って通るため、既知の live prefix 以外を落とす。
          case "$STRIPE_SECRET_KEY" in
            sk_live_*|rk_live_*)
              echo "::notice::STRIPE_SECRET_KEY is a live mode key" ;;
            *)
              echo "::error::STRIPE_SECRET_KEY is NOT a live mode key (must start with sk_live_ / rk_live_). 本番に test key は配備できません (#4104)"
              exit 1 ;;
          esac

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_IAMROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install CDK dependencies
        working-directory: infra/
        run: npm ci

      # Phase 1: Replacement check + Deploy Storage stack (ECR repo, DynamoDB, S3)
      # #1400: cdk diff で Replacement/Destroy リソースを検出し、未承認なら deploy をブロック
      - name: CDK diff — replacement check (Storage)
        working-directory: infra/
        run: |
          # 統合 PR の merge commit は PR body 全体を含み 100KB 超になり得る (第 14 回統合で 147KB、
          # Linux の単一 env 上限 128KB 超過で node が Argument list too long / exit 126)。
          # replacement-approved マーカー検出には先頭で十分なため 64KB に truncate する。
          COMMIT_MSG=$(git log -1 --pretty=%B | head -c 65536)
          npx cdk diff GanbariQuestStorage \
            -c domainName=${{ env.DOMAIN_NAME }} \
            -c certificateArn=${{ env.CERTIFICATE_ARN }} \
            -c gracePeriodDeletionDisabled=${{ vars.GRACE_PERIOD_DELETION_DISABLED || 'false' }} \
            -c cronSecret=${{ secrets.CRON_SECRET }} \
            -c opsSecretKey=${{ secrets.OPS_SECRET_KEY }} \
            -c originVerifySecret=${{ secrets.ORIGIN_VERIFY_SECRET }} \
            2>&1 | COMMIT_MSG="$COMMIT_MSG" node ../scripts/check-cdk-replacement.mjs

      - name: CDK Deploy Storage
        working-directory: infra/
        run: >-
          npx cdk deploy GanbariQuestStorage --require-approval never
          -c domainName=${{ env.DOMAIN_NAME }}
          -c certificateArn=${{ env.CERTIFICATE_ARN }}
          -c gracePeriodDeletionDisabled=${{ vars.GRACE_PERIOD_DELETION_DISABLED || 'false' }}
          -c cronSecret=${{ secrets.CRON_SECRET }}
          -c opsSecretKey=${{ secrets.OPS_SECRET_KEY }}
          -c originVerifySecret=${{ secrets.ORIGIN_VERIFY_SECRET }}

      # Phase 2: Build and push Docker image to ECR (ARM64 native on Graviton runner)
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Install app dependencies
        run: npm ci

      - name: Generate version
        run: npm run version:generate
        env:
          APP_MAJOR_VERSION: ${{ env.APP_MAJOR_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.lambda
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.image-tag }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          # BUILD_TIMESTAMP busts the version:generate layer cache (#711 / PR #826 review).
          # Combined with cache-from: type=gha this ensures the image always stamps
          # a fresh build date even for workflow_dispatch redeploys of the same SHA.
          build-args: |
            BUILD_TIMESTAMP=${{ github.run_id }}-${{ github.run_attempt }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Phase 2.4: #3087 解決策 B — deploy 済 image から SvelteKit client immutable アセットを抽出。
      # NetworkStack の StaticAssetsDeploy (BucketDeployment) が `infra/static-assets/_app/immutable`
      # を S3 に upload し、/_app/immutable/* を S3 (OAC) から配信する。
      # 抽出元は「Lambda が実際に配信するのと同一の build artifact」(同一 image) のため、HTML が
      # 参照する content-hash と S3 の hash が構造的に完全一致する (host 再ビルドによる hash drift を回避)。
      # Dockerfile.lambda は build/ の中身を /app/ に COPY するため client は /app/client。
      - name: Extract SvelteKit client assets for S3 offload (#3087)
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker pull "$IMAGE"
          CID=$(docker create "$IMAGE")
          rm -rf infra/static-assets
          mkdir -p infra/static-assets
          docker cp "$CID:/app/client/_app" infra/static-assets/_app
          docker rm "$CID" >/dev/null
          if [ ! -d infra/static-assets/_app/immutable ]; then
            echo "::error::SvelteKit immutable assets not found at /app/client/_app/immutable in image (#3087)"
            exit 1
          fi
          echo "::notice::Extracted $(find infra/static-assets/_app/immutable -type f | wc -l) immutable asset files for S3 offload"

      # Phase 2.5: Clean up failed stacks and orphaned resources
      - name: Cleanup failed stacks
        continue-on-error: true
        run: |
          for stack in GanbariQuestOps GanbariQuestNetwork GanbariQuestCompute GanbariQuestAuth GanbariQuestSes; do
            status=$(aws cloudformation describe-stacks --stack-name "$stack" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "NOT_FOUND")
            if [ "$status" = "ROLLBACK_COMPLETE" ] || [ "$status" = "DELETE_FAILED" ]; then
              echo "Deleting $stack (status: $status)"
              aws cloudformation delete-stack --stack-name "$stack"
              aws cloudformation wait stack-delete-complete --stack-name "$stack" || true
            fi
          done
          # Delete orphaned S3 bucket left by failed SES stack deploys (RETAIN policy)
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          SES_BUCKET="ganbari-quest-support-mail-${ACCOUNT_ID}"
          SES_STATUS=$(aws cloudformation describe-stacks --stack-name GanbariQuestSes --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "NOT_FOUND")
          echo "SES stack status: $SES_STATUS"
          echo "Checking bucket: $SES_BUCKET"
          # If the SES stack doesn't exist (or is failed), remove the orphaned bucket
          if [ "$SES_STATUS" = "NOT_FOUND" ] || [ "$SES_STATUS" = "ROLLBACK_COMPLETE" ] || [ "$SES_STATUS" = "CREATE_FAILED" ]; then
            echo "SES stack not active. Cleaning up orphaned bucket..."
            aws s3 rb "s3://${SES_BUCKET}" --force 2>&1 || echo "Bucket cleanup skipped (may not exist)"
          fi
          # Note: Cost Anomaly Monitoring はデフォルトモニターを使用（CDK管理外）

      # Phase 2.9 (EPIC #3424 M5 本番 cutover): DSQL cluster/schema の deploy + migrate。
      # 本番は cutover 恒久化のため常時 DSQL (staging の workflow_dispatch opt-in と異なり常時実行)。
      # 旧 #3702 の cutover 前 DynamoDB backup step (fail-closed) は、cutover 完遂 + DynamoDB
      # 撤去 (#3438 Deploy-2) で対象 table が消滅し obsolete 化したため撤去 (#3921。撤去後の
      # 初回 deploy で TableNotFound により本番 deploy が停止する class の根治)。

      # DSQL cluster を deploy (GanbariQuestDsql, DP=true)。bin/app.ts は本番 stack 群を無条件 synth
      # するため、cluster のみの deploy でも Phase 3 と同じ全 context が synth に要る。
      - name: Deploy DSQL cluster (production)
        working-directory: infra/
        run: >-
          npx cdk deploy GanbariQuestDsql --require-approval never
          -c dsqlEnabled=true
          -c domainName=${{ env.DOMAIN_NAME }}
          -c certificateArn=${{ env.CERTIFICATE_ARN }}
          -c staticAssetsS3Offload=true
          -c feedbackDiscordWebhookUrl=${{ secrets.FEEDBACK_DISCORD_WEBHOOK_URL }}
          -c geminiApiKey=${{ secrets.GEMINI_API_KEY }}
          -c stripeSecretKey=${{ secrets.STRIPE_SECRET_KEY }}
          -c stripeWebhookSecret=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          -c stripePriceStandardMonthly=${{ vars.STRIPE_PRICE_STANDARD_MONTHLY }}
          -c stripePriceFamilyMonthly=${{ vars.STRIPE_PRICE_FAMILY_MONTHLY }}
          -c useLookupKey=${{ vars.USE_LOOKUP_KEY || 'true' }}
          -c discordWebhookSupport=${{ secrets.DISCORD_WEBHOOK_SUPPORT }}
          -c gracePeriodDeletionDisabled=${{ vars.GRACE_PERIOD_DELETION_DISABLED || 'false' }}
          -c cronSecret=${{ secrets.CRON_SECRET }}
          -c opsSecretKey=${{ secrets.OPS_SECRET_KEY }}
          -c originVerifySecret=${{ secrets.ORIGIN_VERIFY_SECRET }}
          -c parentGateCookieSecret=${{ secrets.PARENT_GATE_COOKIE_SECRET }}
          -c discordWebhookHealth=${{ secrets.DISCORD_WEBHOOK_HEALTH }}
          ${{ secrets.GOOGLE_OAUTH_CLIENT_ID && format('-c googleClientId={0}', secrets.GOOGLE_OAUTH_CLIENT_ID) || '' }}
          ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET && format('-c googleClientSecret={0}', secrets.GOOGLE_OAUTH_CLIENT_SECRET) || '' }}

      # #4174: incident 通知先 (DISCORD_WEBHOOK_INCIDENT) の配布可否をここで宣言する。
      # compute-stack.ts は `-c discordWebhookIncident` を読む口を持つが、deploy.yml が
      # 渡していなかったため env ごと Lambda から落ち、**本番の incident 通知は 0 通**だった。
      #
      # 欠落しても deploy は止めない (アプリ本体は動く) が、黙って進むと
      # 「障害が起きても誰にも届かない」状態が再び不可視になるため必ず警告する
      # (ADR-0024 ENV silent skip 禁止 / #4167 の任意 env と同じ扱い)。
      #
      # 判定結果は post-deploy の実 env 検証 (下記 "Incident webhook env verification") が
      # 参照する。secret 未登録なら検証を skip、登録済みなのに Lambda env に無ければ配線不良で fail。
      - name: Incident webhook secret presence (#4174)
        run: |
          if [ -z "${{ secrets.DISCORD_WEBHOOK_INCIDENT }}" ]; then
            echo "INCIDENT_WEBHOOK_CONFIGURED=false" >> $GITHUB_ENV
            echo "::warning::DISCORD_WEBHOOK_INCIDENT secret が空です。本番 Lambda に incident 通知先が入らず、障害が起きても通知は 0 通になります (#4174 / #4119)"
          else
            echo "INCIDENT_WEBHOOK_CONFIGURED=true" >> $GITHUB_ENV
            echo "::notice::DISCORD_WEBHOOK_INCIDENT secret を検出しました。deploy 後に実 Lambda env を検証します"
          fi

      - name: Resolve DSQL outputs (production)
        run: |
          ENDPOINT=$(aws cloudformation describe-stacks --stack-name GanbariQuestDsql \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ClusterEndpoint'].OutputValue" --output text)
          ARN=$(aws cloudformation describe-stacks --stack-name GanbariQuestDsql \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ClusterArn'].OutputValue" --output text)
          if [ -z "$ENDPOINT" ] || [ -z "$ARN" ] || [ "$ENDPOINT" = "None" ] || [ "$ARN" = "None" ]; then
            echo "::error::DSQL outputs (ClusterEndpoint/ClusterArn) の取得に失敗しました"
            exit 1
          fi
          echo "DSQL_ENDPOINT=$ENDPOINT" >> $GITHUB_ENV
          echo "DSQL_CLUSTER_ARN=$ARN" >> $GITHUB_ENV
          echo "::notice::DSQL production cluster resolved: $ENDPOINT"

      - name: Provision DSQL schema (production)
        env:
          DSQL_ENDPOINT: ${{ env.DSQL_ENDPOINT }}
        run: npm run dsql:migrate

      # Phase 3: Replacement check + Deploy Compute + Network stacks (Lambda, CloudFront)
      # #1400: Auth / Network / Compute スタック（特に Cognito User Pool）の Replacement を検知
      - name: CDK diff — replacement check (all stacks)
        working-directory: infra/
        run: |
          # 統合 PR の merge commit は PR body 全体を含み 100KB 超になり得る (第 14 回統合で 147KB、
          # Linux の単一 env 上限 128KB 超過で node が Argument list too long / exit 126)。
          # replacement-approved マーカー検出には先頭で十分なため 64KB に truncate する。
          COMMIT_MSG=$(git log -1 --pretty=%B | head -c 65536)
          npx cdk diff --all \
            -c dsqlEnabled=true \
            -c dsqlEndpoint=$DSQL_ENDPOINT \
            -c dsqlClusterArn=$DSQL_CLUSTER_ARN \
            -c domainName=${{ env.DOMAIN_NAME }} \
            -c certificateArn=${{ env.CERTIFICATE_ARN }} \
            -c staticAssetsS3Offload=true \
            -c feedbackDiscordWebhookUrl=${{ secrets.FEEDBACK_DISCORD_WEBHOOK_URL }} \
            -c geminiApiKey=${{ secrets.GEMINI_API_KEY }} \
            -c stripeSecretKey=${{ secrets.STRIPE_SECRET_KEY }} \
            -c stripeWebhookSecret=${{ secrets.STRIPE_WEBHOOK_SECRET }} \
            -c stripePriceStandardMonthly=${{ vars.STRIPE_PRICE_STANDARD_MONTHLY }} \
            -c stripePriceFamilyMonthly=${{ vars.STRIPE_PRICE_FAMILY_MONTHLY }} \
            -c useLookupKey=${{ vars.USE_LOOKUP_KEY || 'true' }} \
            -c discordWebhookSupport=${{ secrets.DISCORD_WEBHOOK_SUPPORT }} \
            -c gracePeriodDeletionDisabled=${{ vars.GRACE_PERIOD_DELETION_DISABLED || 'false' }} \
            -c cronSecret=${{ secrets.CRON_SECRET }} \
            -c opsSecretKey=${{ secrets.OPS_SECRET_KEY }} \
            -c originVerifySecret=${{ secrets.ORIGIN_VERIFY_SECRET }} \
            -c parentGateCookieSecret=${{ secrets.PARENT_GATE_COOKIE_SECRET }} \
            -c discordWebhookHealth=${{ secrets.DISCORD_WEBHOOK_HEALTH }} \
            -c discordWebhookIncident=${{ secrets.DISCORD_WEBHOOK_INCIDENT }} \
            ${{ secrets.GOOGLE_OAUTH_CLIENT_ID && format('-c googleClientId={0}', secrets.GOOGLE_OAUTH_CLIENT_ID) || '' }} \
            ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET && format('-c googleClientSecret={0}', secrets.GOOGLE_OAUTH_CLIENT_SECRET) || '' }} \
            2>&1 | COMMIT_MSG="$COMMIT_MSG" node ../scripts/check-cdk-replacement.mjs

      - name: CDK Deploy all stacks
        working-directory: infra/
        run: >-
          npx cdk deploy --all --require-approval never --outputs-file cdk-outputs.json
          -c dsqlEnabled=true
          -c dsqlEndpoint=$DSQL_ENDPOINT
          -c dsqlClusterArn=$DSQL_CLUSTER_ARN
          -c domainName=${{ env.DOMAIN_NAME }}
          -c certificateArn=${{ env.CERTIFICATE_ARN }}
          -c staticAssetsS3Offload=true
          -c feedbackDiscordWebhookUrl=${{ secrets.FEEDBACK_DISCORD_WEBHOOK_URL }}
          -c geminiApiKey=${{ secrets.GEMINI_API_KEY }}
          -c stripeSecretKey=${{ secrets.STRIPE_SECRET_KEY }}
          -c stripeWebhookSecret=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          -c stripePriceStandardMonthly=${{ vars.STRIPE_PRICE_STANDARD_MONTHLY }}
          -c stripePriceFamilyMonthly=${{ vars.STRIPE_PRICE_FAMILY_MONTHLY }}
          -c useLookupKey=${{ vars.USE_LOOKUP_KEY || 'true' }}
          -c discordWebhookSupport=${{ secrets.DISCORD_WEBHOOK_SUPPORT }}
          -c gracePeriodDeletionDisabled=${{ vars.GRACE_PERIOD_DELETION_DISABLED || 'false' }}
          -c cronSecret=${{ secrets.CRON_SECRET }}
          -c opsSecretKey=${{ secrets.OPS_SECRET_KEY }}
          -c originVerifySecret=${{ secrets.ORIGIN_VERIFY_SECRET }}
          -c parentGateCookieSecret=${{ secrets.PARENT_GATE_COOKIE_SECRET }}
          -c discordWebhookHealth=${{ secrets.DISCORD_WEBHOOK_HEALTH }}
          -c discordWebhookIncident=${{ secrets.DISCORD_WEBHOOK_INCIDENT }}
          ${{ secrets.GOOGLE_OAUTH_CLIENT_ID && format('-c googleClientId={0}', secrets.GOOGLE_OAUTH_CLIENT_ID) || '' }}
          ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET && format('-c googleClientSecret={0}', secrets.GOOGLE_OAUTH_CLIENT_SECRET) || '' }}

      # #3881: rollback-orphan による named resource "already exists" block の検知。
      # CDK deploy (DSQL / all stacks) が失敗した場合、stack events / 失敗 change set から
      # "already exists" を探し、該当時は掃除 runbook link を fail message に埋め込む
      # (第16回リリースで orphan BackupVault が再 deploy を block し手動介入を要した実障害の再発対応)。
      - name: Orphan-block detection (already exists -> runbook, #3881)
        if: failure()
        run: |
          RUNBOOK="https://github.com/${{ github.repository }}/blob/main/docs/runbooks/rollback-orphan-cleanup.md"
          found=0
          for stack in GanbariQuestDsql GanbariQuestStorage GanbariQuestAuth GanbariQuestCompute GanbariQuestNetwork GanbariQuestSes GanbariQuestOps; do
            events=$(aws cloudformation describe-stack-events --stack-name "$stack" --max-items 60 \
              --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED`].[LogicalResourceId,ResourceStatusReason]' \
              --output text 2>/dev/null | grep -i "already exists" || true)
            changesets=$(aws cloudformation list-change-sets --stack-name "$stack" \
              --query 'Summaries[?Status==`FAILED`].[ChangeSetName,StatusReason]' \
              --output text 2>/dev/null | grep -i "already exists" || true)
            if [ -n "$events" ] || [ -n "$changesets" ]; then
              found=1
              echo "::error::[$stack] rollback-orphan による名前衝突 (already exists) を検出:"
              [ -n "$events" ] && echo "$events"
              [ -n "$changesets" ] && echo "$changesets"
            fi
          done
          if [ "$found" -eq 1 ]; then
            echo "::error::orphan named resource が再 deploy を block しています。掃除手順 (判断 gate 含む): $RUNBOOK"
          else
            echo "already exists 型の失敗イベントは検出されませんでした (別要因の deploy 失敗)"
          fi

      # Phase 3.5 (#3646 本番 cutover): DSQL app role (app_user) provisioning。Lambda 実行 role は
      # dsql:DbConnect のみ持つ (最小権限) が DSQL 認可仕様では DbConnect は custom database role 専用の
      # ため、CREATE ROLE + AWS IAM GRANT (Lambda role ARN 紐付け) + 表 GRANT を冪等適用する。
      # compute deploy 後 = Lambda 実行 role ARN 確定後、health check 前に置く。
      - name: Grant DSQL app role to Lambda (production)
        env:
          DSQL_ENDPOINT: ${{ env.DSQL_ENDPOINT }}
        run: |
          LAMBDA_ROLE_ARN=$(aws lambda get-function-configuration \
            --function-name "$LAMBDA_FUNCTION" --region "$AWS_REGION" \
            --query 'Role' --output text)
          echo "::notice::Granting app_user to $LAMBDA_ROLE_ARN"
          npm run dsql:grant -- --iam-role-arn "$LAMBDA_ROLE_ARN"

      # Phase 4: Update Lambda to use the new image
      - name: Update Lambda function image (production)
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION \
            --image-uri $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --region $AWS_REGION

      - name: Wait for Lambda update (production)
        run: |
          aws lambda wait function-updated \
            --function-name $LAMBDA_FUNCTION \
            --region $AWS_REGION

      # #4352: IaC の外で足された env (out-of-band drift) の検出。
      #
      # CloudFormation はテンプレート無変更ならリソースを触らないため、`aws lambda
      # update-function-configuration` で手で足した env は **次の deploy でも消えない**
      # (staging では実際に検証用の STRIPE_PRICE_* が full deploy を跨いで残り、#4286 の
      # 修正が効いているかを staging で判定できない状態が続いた、#4117 E1)。
      #
      # 上の "Incident webhook env verification" が「あるべきキーがあるか」を見るのに対し、
      # 本 step は「**あるべきでないキーが無いか**」を見る (逆方向)。値は読まずキー名だけで判定する。
      # 欠落 (テンプレートにあるが live に無い) は warning に留め、extra のみ hard-fail する。
      - name: Lambda env drift check (production, #4352)
        run: |
          node scripts/check-lambda-env-drift.mjs \
            --function "$LAMBDA_FUNCTION" \
            --template infra/cdk.out/GanbariQuestCompute.template.json \
            --logical-id-prefix SvelteKitFn \
            --region "$AWS_REGION"

      # #4174: **synth の diff ではなく、deploy 済み Lambda の実 env** を読んで検証する。
      # compute-stack.ts は空値のとき env ごと落とす (`...(x ? {KEY: x} : {})`) ため、
      # 「context を渡し忘れた」「secret 名を間違えた」のいずれでも **deploy は成功したまま
      # 通知だけが 0 通**になる。#4119 (NUC で 18 晩 alert 0 通) と同型の failure mode で、
      # 実 env を見る以外に検出手段がない。
      #
      # 判定:
      #   - secret 未登録 (INCIDENT_WEBHOOK_CONFIGURED=false) → skip (前段で warning 済)
      #   - secret 登録済 かつ env に存在 → pass
      #   - secret 登録済 なのに env に無い → **配線不良として hard-fail**
      #
      # 本 step の失敗は image rollback を起こさない (rollback は health check 失敗時に限定)。
      # アプリ本体は健全なので巻き戻す理由がなく、deploy を赤くして配線不良を可視化するのが目的。
      #
      # `keys()` で **key 名だけ**を取り出す。webhook URL そのものはシェル変数にも載せない。
      - name: Incident webhook env verification (production, #4174)
        run: |
          if [ "$INCIDENT_WEBHOOK_CONFIGURED" != "true" ]; then
            echo "::warning::DISCORD_WEBHOOK_INCIDENT secret 未登録のため実 env 検証を skip します (#4174)"
            exit 0
          fi
          KEYS=$(aws lambda get-function-configuration \
            --function-name "$LAMBDA_FUNCTION" --region "$AWS_REGION" \
            --query 'keys(Environment.Variables)' --output text | tr '\t' '\n')
          if echo "$KEYS" | grep -qx "DISCORD_WEBHOOK_INCIDENT"; then
            echo "::notice::DISCORD_WEBHOOK_INCIDENT が本番 Lambda の実 env に存在します (#4174)"
          else
            echo "::error::DISCORD_WEBHOOK_INCIDENT が本番 Lambda の env にありません。secret は登録済のため CDK context の配線不良です (#4174)。障害が起きても通知は 0 通になります"
            exit 1
          fi

      # #4189 (オーナー決裁 2026-08-03、案 B): CloudWatch アラームの宛先を Discord に寄せた。
      # **メール subscription を張らなくなった**ため、転送 Lambda が繋がっていなければ
      # 全 alarm が宛先ゼロに戻る (#4189 の再演)。deploy 後に**実物**を 2 点見る。
      #
      #   1. SNS topic に subscription が 1 件以上ある (protocol=lambda)
      #   2. 転送 Lambda の実 env に DISCORD_WEBHOOK_INCIDENT がある
      #
      # 「synth では繋がっているが実環境では届かない」を検出するのが目的なので、
      # template ではなく **deploy 済みリソース**を問い合わせる。
      - name: Ops alarm destination verification (production, #4189)
        run: |
          TOPIC_ARN=$(aws sns list-topics --region "$AWS_REGION" \
            --query "Topics[?ends_with(TopicArn, ':ganbari-quest-ops-alerts')].TopicArn | [0]" \
            --output text)
          if [ -z "$TOPIC_ARN" ] || [ "$TOPIC_ARN" = "None" ]; then
            echo "::error::SNS topic 'ganbari-quest-ops-alerts' が見つかりません (#4189)"
            exit 1
          fi
          SUB_COUNT=$(aws sns list-subscriptions-by-topic --topic-arn "$TOPIC_ARN" \
            --region "$AWS_REGION" \
            --query "length(Subscriptions[?Protocol=='lambda'])" --output text)
          if [ "$SUB_COUNT" = "0" ] || [ -z "$SUB_COUNT" ]; then
            echo "::error::ops-alerts topic に lambda subscription が 0 件です。CloudWatch アラームが鳴っても誰にも届きません (#4189)"
            exit 1
          fi
          echo "::notice::ops-alerts topic に lambda subscription が ${SUB_COUNT} 件あります (#4189)"

          FWD_KEYS=$(aws lambda get-function-configuration \
            --function-name ganbari-quest-ops-alert-forwarder --region "$AWS_REGION" \
            --query 'keys(Environment.Variables)' --output text | tr '\t' '\n')
          if echo "$FWD_KEYS" | grep -qx "DISCORD_WEBHOOK_INCIDENT"; then
            echo "::notice::転送 Lambda の実 env に DISCORD_WEBHOOK_INCIDENT があります (#4189)"
          else
            echo "::error::転送 Lambda に DISCORD_WEBHOOK_INCIDENT がありません。alarm は SNS までは届きますが Discord には出ません (#4189)"
            exit 1
          fi

      # ADR-0048 hotfix #6 (2026-05-16): demo Lambda は `latest` タグで CDK 管理されるため
      # CloudFormation が新しい image push を検知できない (production と同じ問題)。
      # production と同じく aws lambda update-function-code で SHA タグ image に明示更新する。
      # 該当しない時のスキップ条件: demo Lambda がまだ存在しない (初回 deploy 前)。
      - name: Update Lambda function image (demo)
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws lambda get-function --function-name ganbari-quest-app-demo --region $AWS_REGION > /dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name ganbari-quest-app-demo \
              --image-uri $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
              --region $AWS_REGION
            aws lambda wait function-updated \
              --function-name ganbari-quest-app-demo \
              --region $AWS_REGION
            echo "::notice::demo Lambda image updated to $IMAGE_TAG"
          else
            echo "::notice::demo Lambda not yet deployed; skipping image update"
          fi

      # #1586: cron-dispatcher Lambda の env 注入が正しいか dryRun で検証する。
      # Issue #1586 では PR#1509 マージ後 2 日間 dispatcher が CRON_SECRET 未注入のまま
      # silent fail していた (post-deploy smoke test 不在のため気付かず)。再発防止策。
      # dryRun: true で env 検証のみ実行し、ジョブ副作用は起こさない。
      - name: Cron dispatcher smoke test
        run: |
          aws lambda invoke \
            --function-name ganbari-quest-cron-dispatcher \
            --payload '{"cronJob":"retention-cleanup","dryRun":true}' \
            --cli-binary-format raw-in-base64-out \
            --region $AWS_REGION \
            cron-dispatcher-response.json
          echo "=== cron-dispatcher response ==="
          cat cron-dispatcher-response.json
          echo ""
          if ! grep -q '"statusCode":200' cron-dispatcher-response.json; then
            echo "::error::cron-dispatcher smoke test failed — env injection broken (#1586)"
            exit 1
          fi
          if ! grep -q '"dryRun":true' cron-dispatcher-response.json; then
            echo "::error::cron-dispatcher smoke test did not run in dryRun mode (#1586)"
            exit 1
          fi
          echo "::notice::cron-dispatcher env injection (dryRun) passed"

          # --- #4206: 実 HTTP 経路が cron route まで届くかを確かめる ---
          #
          # 上の dryRun は HTTP POST の**手前で return する**。そのため本番の cron が
          # 稼働開始 (2026-04) から約 4 ヶ月間 成功 0 回だった間も、この smoke は
          # ずっと green だった (原因は isPublicRoute に /api/cron が無く、hooks の
          # 認可層が 401 を返して route に到達していなかったこと。#4216 で修正)。
          #
          # そこで **わざと誤った secret** で 1 回叩き、返る 401 の本文で
          # 「どこで落ちたか」を判別する。認証は job 実行前に落ちるので副作用はゼロ。
          #
          #   route 側 (verifyCronAuth) の {"error":"Unauthorized"}  → 到達している = OK
          #   hooks 側 (hooks.server.ts) の {"error":"認証が必要です"} → 到達していない = FAIL
          #
          # ステータスコードはどちらも 401 なので、**本文を見ないと区別できない**。
          FN_URL=$(aws lambda get-function-url-config \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION" \
            --query 'FunctionUrl' --output text)
          FN_URL="${FN_URL%/}"

          # リトライ方針: **判別できなかったときだけ**やり直す。
          #   - `認証が必要です` (= 届いていない) は確定的な検出なので **即 fail**。
          #     ここでリトライすると、本 gate が守ろうとしている壊れを自分で握り潰す。
          #   - どちらの本文でもない場合のみ transient (cold start / 一時的な 5xx) とみなし再試行。
          CRON_PROBE_BODY=""
          for i in 1 2 3; do
            CRON_PROBE_BODY=$(curl -s --max-time 30 -X POST \
              -H "Authorization: Bearer invalid-secret-for-reachability-probe" \
              -H "Content-Type: application/json" \
              -d '{}' \
              "${FN_URL}/api/cron/export-build" || echo "")
            echo "=== cron route reachability probe (attempt $i) ==="
            echo "$CRON_PROBE_BODY"
            if echo "$CRON_PROBE_BODY" | grep -qE '認証が必要です|Unauthorized'; then
              break
            fi
            echo "::notice::probe の応答を判別できませんでした。10s 後に再試行します"
            sleep 10
          done

          if echo "$CRON_PROBE_BODY" | grep -q '認証が必要です'; then
            echo "::error::cron route unreachable — hooks の認可層が 401 を返しています。isPublicRoute に /api/cron が無い状態です (#4206 の再発)。この状態では全 cron が 100% 失敗します"
            exit 1
          fi
          if ! echo "$CRON_PROBE_BODY" | grep -q 'Unauthorized'; then
            echo "::error::cron route probe が 3 回とも想定外の応答を返しました。誤った secret には route 側 verifyCronAuth の Unauthorized が返るはずです (#4206)"
            exit 1
          fi
          echo "::notice::cron dispatcher smoke test passed (env injection + route reachability)"

      # ADR-0048 / #2130: demo Lambda post-deploy smoke test
      # PR #2124 (week 4) merge 後 3 件の hotfix (#2127 / #2128 / #2129) が連続発生し、
      # 特に #2129 (AUTH_MODE=anonymous skip for assertLicenseKeyConfigured 502 hotfix) は
      # CI 段階で検出されるべき機能的 fail だった。post-deploy smoke が無いため deploy 完了
      # 後に LP→demo 遷移先 502 で初めて露呈した経緯。
      #
      # 対策: production と同じく demo Lambda function URL 直接で 200 (直接応答) または
      # 302 (root から /switch へ redirect、demo Lambda root の正常仕様 — #2284) を確認し、
      # 502/503/504 (runtime crash) は hard-fail させて Rollback step に遷移させる。
      # デモ環境はまだ存在しない可能性があるため (初回 deploy 前 / disable 時) skip 条件付き。
      - name: Demo Lambda smoke test (#2130)
        id: demo-smoke
        continue-on-error: false
        run: |
          if ! aws lambda get-function --function-name ganbari-quest-app-demo --region $AWS_REGION > /dev/null 2>&1; then
            echo "::notice::demo Lambda not deployed; skipping smoke test"
            exit 0
          fi
          DEMO_URL=$(aws lambda get-function-url-config \
            --function-name ganbari-quest-app-demo \
            --region $AWS_REGION \
            --query 'FunctionUrl' --output text 2>/dev/null || echo "")
          if [ -z "$DEMO_URL" ] || [ "$DEMO_URL" = "None" ]; then
            echo "::warning::demo Lambda has no Function URL; skipping smoke test"
            exit 0
          fi
          echo "Demo smoke target: $DEMO_URL"
          echo "Waiting 10s for Lambda cold start..."
          sleep 10
          # 200 = direct response OK / 302 = root path redirect to /switch (正常仕様、#2284)
          # 502/503/504 のみ runtime crash として fail 判定対象
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sk -o /tmp/demo-smoke-body.txt -w "%{http_code}" "$DEMO_URL")
            echo "Attempt $i: status=$STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
              echo "::notice::demo Lambda smoke test passed ($STATUS OK — 200 direct or 302 /switch redirect)"
              exit 0
            fi
            if [ "$STATUS" = "502" ] || [ "$STATUS" = "503" ] || [ "$STATUS" = "504" ]; then
              echo "::warning::demo Lambda returned $STATUS — likely runtime crash (e.g. #2129 assertLicenseKeyConfigured)"
              echo "=== Response body (last 500 chars) ==="
              tail -c 500 /tmp/demo-smoke-body.txt || true
            fi
            echo "Retrying in 10s..."
            sleep 10
          done
          echo "::error::demo Lambda smoke test failed after 5 attempts (last status: $STATUS) — see ADR-0048 / #2130 / #2284"
          exit 1

      # Phase 5: Post-deployment health check (with retry)
      # Lambda Function URL 直接で確認（DNS 障害時もデプロイ判定可能）
      - name: Health check
        id: healthcheck
        run: |
          FUNCTION_URL=$(aws lambda get-function-url-config \
            --function-name $LAMBDA_FUNCTION \
            --region $AWS_REGION \
            --query 'FunctionUrl' --output text)
          echo "Health check target: ${FUNCTION_URL}api/health"
          echo "Waiting 10s for Lambda cold start..."
          sleep 10
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${FUNCTION_URL}api/health")
            echo "Attempt $i: status=$STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 5 attempts (last status: $STATUS)"
          exit 1

      # #4280: front door 検査が**実際に効いているか**を deploy 後に確認する。
      # health check (/api/health) は front door 対象外なので必ず 200 を返し、
      # 「検査が黙って無効」を検出できない (ADR-0024 silent skip 禁止の実効化)。
      # header を付けずに /admin を叩いて 404 が返ることが、enforcement が live な証拠になる。
      #
      # 検出できない残余: CloudFront 側 header が origin 側 env とずれる方向。
      # 検証には CloudFront 経由の request が要るが、本番 CloudFront は geoRestriction JP で
      # GitHub Actions runner (日本国外) からは 403 になるため自動化できない (PR #4312 で明示)。
      - name: Front door enforcement check (#4280)
        run: |
          FUNCTION_URL=$(aws lambda get-function-url-config             --function-name $LAMBDA_FUNCTION             --region $AWS_REGION             --query 'FunctionUrl' --output text)
          FUNCTION_URL="${FUNCTION_URL%/}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${FUNCTION_URL}/admin")
          echo "Front door check: GET ${FUNCTION_URL}/admin (no header) -> $STATUS"
          if [ "$STATUS" != "404" ]; then
            echo "::error::front door 検査が効いていません (期待 404、実際 $STATUS)。ORIGIN_VERIFY_SECRET が Lambda env に届いていない可能性があります。この状態では /admin ・ /ops に Function URL 直で到達でき、CloudFront 層の制御 (geoRestriction) を迂回できます (#4280)"
            exit 1
          fi
          echo "::notice::front door enforcement is live (Function URL 直の /admin は 404)"

      # Phase 5b: Rollback on health check failure
      - name: Rollback on failure
        if: failure() && steps.healthcheck.outcome == 'failure'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          echo "Deployment failed, rolling back to previous image..."
          PREVIOUS_DIGEST=$(aws ecr describe-images \
            --repository-name $ECR_REPOSITORY \
            --query 'sort_by(imageDetails,&imagePushedAt)[-2].imageDigest' \
            --output text \
            --region $AWS_REGION)
          if [ "$PREVIOUS_DIGEST" = "None" ] || [ -z "$PREVIOUS_DIGEST" ]; then
            echo "No previous image found, cannot rollback"
            exit 1
          fi
          echo "Rolling back to image digest: $PREVIOUS_DIGEST"
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION \
            --image-uri $ECR_REGISTRY/$ECR_REPOSITORY@$PREVIOUS_DIGEST \
            --region $AWS_REGION
          aws lambda wait function-updated \
            --function-name $LAMBDA_FUNCTION \
            --region $AWS_REGION
          echo "Rollback complete"

      # Phase 5c: Post-deploy resource & cost audit
      - name: Post-deploy resource audit
        continue-on-error: true
        run: |
          echo "=== CloudFormation Stack Resource Count ==="
          for stack in GanbariQuestStorage GanbariQuestAuth GanbariQuestCompute GanbariQuestNetwork GanbariQuestSes GanbariQuestOps; do
            count=$(aws cloudformation list-stack-resources --stack-name "$stack" --query 'length(StackResourceSummaries)' --output text 2>/dev/null || echo "N/A")
            echo "$stack: $count resources"
          done

          echo ""
          echo "=== Lambda Functions (expected: 2) ==="
          aws lambda list-functions --query 'Functions[?starts_with(FunctionName,`ganbari`)].{Name:FunctionName,Memory:MemorySize,Timeout:Timeout}' --output table

          echo ""
          echo "=== DynamoDB Tables (#3438 で CDK 撤去済。RETAIN-orphan が物理削除まで残存し得るため expected: 0-1) ==="
          aws dynamodb list-tables --query 'TableNames[?contains(@,`ganbari`)]' --output text

          echo ""
          echo "=== S3 Buckets (expected: 2) ==="
          aws s3api list-buckets --query 'Buckets[?contains(Name,`ganbari`)].Name' --output text

          echo ""
          echo "=== ECR Repositories (expected: 1) ==="
          aws ecr describe-repositories --query 'repositories[?contains(repositoryName,`ganbari`)].{Name:repositoryName}' --output table 2>/dev/null || true

          echo ""
          echo "=== CloudWatch Log Groups ==="
          aws logs describe-log-groups --log-group-name-prefix "/aws/lambda/ganbari" --query 'logGroups[].{Name:logGroupName,RetentionDays:retentionInDays,StoredBytes:storedBytes}' --output table

          echo ""
          echo "=== Current month cost estimate ==="
          aws ce get-cost-and-usage \
            --time-period Start=$(date -u +%Y-%m-01),End=$(date -u +%Y-%m-%d) \
            --granularity MONTHLY \
            --metrics "UnblendedCost" \
            --query 'ResultsByTime[0].Total.UnblendedCost.{Amount:Amount,Unit:Unit}' \
            --output table 2>/dev/null || echo "Cost Explorer not available"

      - name: Detect orphaned resources
        continue-on-error: true
        run: |
          echo "=== Orphaned Lambda Functions (not in any stack) ==="
          all_lambdas=$(aws lambda list-functions --query 'Functions[?starts_with(FunctionName,`ganbari`)].FunctionName' --output text)
          managed_lambdas=""
          for stack in GanbariQuestStorage GanbariQuestAuth GanbariQuestCompute GanbariQuestNetwork GanbariQuestSes GanbariQuestOps; do
            managed=$(aws cloudformation list-stack-resources --stack-name "$stack" --query 'StackResourceSummaries[?ResourceType==`AWS::Lambda::Function`].PhysicalResourceId' --output text 2>/dev/null)
            managed_lambdas="$managed_lambdas $managed"
          done
          orphaned=0
          for fn in $all_lambdas; do
            if ! echo "$managed_lambdas" | grep -q "$fn"; then
              echo "ORPHANED: $fn"
              orphaned=$((orphaned + 1))
            fi
          done
          [ $orphaned -eq 0 ] && echo "None found"

          echo ""
          echo "=== Orphaned CloudWatch Log Groups ==="
          orphaned_logs=0
          for lg in $(aws logs describe-log-groups --log-group-name-prefix "/aws/lambda/ganbari" --query 'logGroups[].logGroupName' --output text); do
            fn_name=$(echo "$lg" | sed 's|/aws/lambda/||')
            if ! aws lambda get-function --function-name "$fn_name" > /dev/null 2>&1; then
              echo "ORPHANED LOG GROUP: $lg"
              orphaned_logs=$((orphaned_logs + 1))
            fi
          done
          [ $orphaned_logs -eq 0 ] && echo "None found"

          echo ""
          echo "=== Orphaned Cost Anomaly Monitors ==="
          aws ce get-anomaly-monitors --query 'AnomalyMonitors[?contains(MonitorName,`ganbari`) || contains(MonitorName,`gq-cost`)].{Name:MonitorName,Arn:MonitorArn}' --output table 2>/dev/null || echo "None found"

      - name: Show deployment outputs
        working-directory: infra/
        if: always()
        run: cat cdk-outputs.json 2>/dev/null || echo "No outputs file"

      # #3808 (#3437 F-3 / ADR-0024 (c)): DSQL AWS Backup 構成の post-deploy smoke test。
      # CDK 単体テストは synth 段階 (template にリソースが存在すること) のみを検証し、AWS 上で
      # backup plan / selection / vault が実在し日次 backup が回っている保証はゼロだった。
      # #1586 (Cron dispatcher smoke test) と同型の「deploy 後に実 AWS 構成を assert する」パターン。
      # - vault / plan の実在 + selection が本番 DSQL cluster ARN と確定 role (#3437 F-4) を指すことを assert
      # - recovery point は日次 02:00 UTC 生成のため deploy 直後に無いのが正常 —
      #   「存在すれば最新の age < 48h」の条件付き check とし、初回 deploy の false-fail を避ける。
      #   存在するのに 48h 超 stale = 日次 backup の沈黙停止 → hard fail (ADR-0006 silent skip 禁止)。
      # 失敗時は deploy job 全体が fail 扱い (health check 通過後のため app rollback は発火しない —
      # backup 構成不備は app image の問題ではないため rollback 対象外が正しい)。
      - name: DSQL backup smoke test (#3808)
        run: |
          set -euo pipefail
          VAULT="ganbari-quest-dsql-vault"
          PLAN_NAME="ganbari-quest-dsql-daily"
          ROLE_NAME="ganbari-quest-dsql-backup-role"

          # 1. backup vault 実在 (dsql-stack.ts DsqlBackupVault、RETAIN)
          aws backup describe-backup-vault \
            --backup-vault-name "$VAULT" --region "$AWS_REGION" > /dev/null
          echo "::notice::backup vault OK: $VAULT"

          # 2. backup plan 実在 (名前一致で解決、dsql-stack.ts DsqlBackupPlan)
          PLAN_ID=$(aws backup list-backup-plans --region "$AWS_REGION" \
            --query "BackupPlansList[?BackupPlanName=='$PLAN_NAME'] | [0].BackupPlanId" \
            --output text)
          if [ -z "$PLAN_ID" ] || [ "$PLAN_ID" = "None" ]; then
            echo "::error::backup plan '$PLAN_NAME' が AWS 上に存在しません (#3808 / dsql-stack.ts DsqlBackupPlan)"
            exit 1
          fi
          echo "::notice::backup plan OK: $PLAN_NAME ($PLAN_ID)"

          # 3. selection が本番 DSQL cluster ARN + 確定 role (#3437 F-4) を指す
          SELECTION_ID=$(aws backup list-backup-selections \
            --backup-plan-id "$PLAN_ID" --region "$AWS_REGION" \
            --query 'BackupSelectionsList[0].SelectionId' --output text)
          if [ -z "$SELECTION_ID" ] || [ "$SELECTION_ID" = "None" ]; then
            echo "::error::backup plan '$PLAN_NAME' に resource selection がありません (#3808)"
            exit 1
          fi
          SEL_JSON=$(aws backup get-backup-selection \
            --backup-plan-id "$PLAN_ID" --selection-id "$SELECTION_ID" --region "$AWS_REGION")
          if ! echo "$SEL_JSON" | grep -qF "$DSQL_CLUSTER_ARN"; then
            echo "::error::backup selection が本番 DSQL cluster ($DSQL_CLUSTER_ARN) を含みません (#3808)"
            exit 1
          fi
          if ! echo "$SEL_JSON" | grep -qF "$ROLE_NAME"; then
            echo "::error::backup selection の IAM role が $ROLE_NAME ではありません (#3437 F-4 / #3808)"
            exit 1
          fi
          echo "::notice::backup selection OK: DSQL cluster + $ROLE_NAME"

          # 4. recovery point (条件付き): 無し = 初回 deploy 直後の正常状態 (日次 02:00 UTC 生成)。
          #    有るのに最新が 48h 超 stale = 日次 backup が 2 日以上生成されていない → hard fail。
          LATEST=$(aws backup list-recovery-points-by-backup-vault \
            --backup-vault-name "$VAULT" --region "$AWS_REGION" \
            --query 'max_by(RecoveryPoints, &CreationDate).CreationDate' --output text)
          if [ -z "$LATEST" ] || [ "$LATEST" = "None" ]; then
            echo "::notice::recovery point は未生成 (日次 02:00 UTC 生成のため初回 deploy 直後は正常、#3808)"
          else
            # AWS CLI v2 既定は iso8601、v1 互換 (epoch float) にも fallback で対応
            LATEST_SEC=$(date -u -d "$LATEST" +%s 2>/dev/null || printf '%.0f' "$LATEST")
            NOW_SEC=$(date -u +%s)
            AGE_H=$(( (NOW_SEC - LATEST_SEC) / 3600 ))
            if [ "$AGE_H" -ge 48 ]; then
              echo "::error::最新 recovery point が ${AGE_H}h 前 — 日次 backup が 2 日以上生成されていません (#3808 / runbook: docs/runbooks/dsql-restore.md)"
              exit 1
            fi
            echo "::notice::recovery point OK: 最新は ${AGE_H}h 前 (< 48h)"
          fi
          echo "::notice::DSQL backup smoke test passed (#3808)"

  e2e-production:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      # #1007: test job と同一の cache key で Playwright browsers を共有
      # 同一 workflow run 内では test job が保存した cache を即時利用可能
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # CloudFront Geo Restriction (JP only) のため、Lambda Function URL 直接でテスト
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_IAMROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Lambda Function URL
        id: function-url
        run: |
          FUNCTION_URL=$(aws lambda get-function-url-config \
            --function-name $LAMBDA_FUNCTION \
            --region $AWS_REGION \
            --query 'FunctionUrl' --output text)
          # Remove trailing slash for consistency
          FUNCTION_URL="${FUNCTION_URL%/}"
          echo "url=$FUNCTION_URL" >> "$GITHUB_OUTPUT"
          echo "E2E target: $FUNCTION_URL"

      - name: Wait for deployment propagation
        run: sleep 15

      - name: Run Production Smoke Test
        run: npx playwright test --config playwright.production.config.ts
        env:
          E2E_BASE_URL: ${{ steps.function-url.outputs.url }}
          # #4280: 本 smoke は Function URL を直接叩く (本番 CloudFront は geoRestriction JP で
          # runner が日本国外のため経由できない)。front door 検査が掛かる /admin へ遷移するので、
          # CloudFront が付けるのと同じ header を smoke 自身が付ける。未注入だと login 後の
          # /admin が 404 になり deploy のたびに偽の赤が出る。
          # trace は secret 保持時 off (public repo の artifact に header が載るため、config 参照)。
          ORIGIN_VERIFY_SECRET: ${{ secrets.ORIGIN_VERIFY_SECRET }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload Production E2E results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-production-results
          path: test-results/
          retention-days: 14

  release:
    needs: [deploy, e2e-production]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Deploy Info
            - **Version**: ${{ github.ref_name }}
            - **Commit**: ${{ github.sha }}
            - **Docker Image**: `${{ needs.deploy.outputs.image-tag }}`
            - **Deploy Date**: ${{ github.event.head_commit.timestamp }}

  release-notes:
    needs: [deploy, e2e-production]
    runs-on: ubuntu-latest
    if: needs.deploy.result == 'success' && needs.e2e-production.result != 'failure'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - name: Get commit messages since last deploy
        id: commits
        run: |
          PREV=$(git tag --sort=-creatordate | grep '^deploy-' | head -1 || echo "")
          if [ -z "$PREV" ]; then
            RAW=$(git log --format="%s" --no-merges -10)
          else
            RAW=$(git log ${PREV}..HEAD --format="%s" --no-merges | head -30)
          fi

          # 前処理: チケット番号除去、プレフィックス日本語化、技術系除外
          MESSAGES=$(echo "$RAW" |
            sed 's/#[0-9]\+//g' |
            sed 's/^feat: /機能: /g' |
            sed 's/^fix: /修正: /g' |
            sed 's/^docs: /ドキュメント: /g' |
            sed 's/^refactor: /改善: /g' |
            sed 's/^perf: /改善: /g' |
            sed 's/^chore: /保守: /g' |
            sed 's/^test: /テスト: /g' |
            sed 's/^ci: /CI: /g' |
            sed 's/^build: /ビルド: /g' |
            grep -v "^ドキュメント:" |
            grep -v "^テスト:" |
            grep -v "^保守:" |
            grep -v "^CI:" |
            grep -v "^ビルド:" |
            grep -v "Co-Authored-By:" |
            sed 's/  */ /g' |
            sed 's/^ //g' |
            sed '/^$/d' |
            sed 's/^/- /')

          echo "messages<<EOF" >> "$GITHUB_OUTPUT"
          echo "$MESSAGES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "source=preprocessed" >> "$GITHUB_OUTPUT"

      - name: Tag current deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "deploy-$(date +%Y%m%d-%H%M%S)-$(echo ${{ github.sha }} | cut -c1-7)"
          git push origin --tags
        continue-on-error: true

      - name: Generate user-facing release notes (Gemini)
        id: release-notes
        if: env.GEMINI_API_KEY != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMIT_MESSAGES: ${{ steps.commits.outputs.messages }}
        run: |
          PROMPT="あなたは「がんばりクエスト」（子供の頑張りをゲーム感覚で見守る家族向けアプリ）のリリースノートライターです。
          以下の開発ログを、アプリを使う保護者・お子様向けのお知らせ文に書き換えてください。

          ルール:
          - ユーザーに見える変化（機能追加・UI改善・バグ修正）のみを記載する
          - インフラ・依存関係・テスト・リファクタリングのみの場合は「SKIP」とだけ返す
          - 「🆕 新機能・改善」「🐛 不具合修正」のカテゴリで分けて箇条書きにする
          - 各項目は「〜しました」「〜できるようになりました」で終わる文体にする
          - 技術用語（commit hash, CDK, Lambda, CloudFront, API等）は使わない
          - チケット番号（#0160 等）は削除する
          - 何が便利になったか、何が直ったかを具体的に書く
          - 子供にも分かる表現を心がける（例: 「演出」→「キラキラ効果」）
          - 英語の機能名は日本語に訳す（例: overlay → 画面表示）
          - 箇条書きは「• 」で始める（「- 」ではない）
          - 最大 8 項目まで

          コミット:
          ${COMMIT_MESSAGES}"

          RESPONSE=$(curl -s \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-lite:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"contents\":[{\"parts\":[{\"text\":$(echo "$PROMPT" | jq -Rs .)}]}]}")

          NOTES=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // "SKIP"')
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if [ "$NOTES" != "SKIP" ] && [ -n "$NOTES" ]; then
            echo "::notice::📝 Release notes generated by Gemini AI"
          fi

      - name: Build fallback release notes (Gemini unavailable)
        id: fallback-notes
        if: env.GEMINI_API_KEY == '' || steps.release-notes.outputs.notes == '' || steps.release-notes.outputs.notes == 'SKIP'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMIT_MESSAGES: ${{ steps.commits.outputs.messages }}
        run: |
          if [ -z "$COMMIT_MESSAGES" ]; then
            echo "notes=SKIP" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # カテゴリ分け: 機能・改善を抽出
          FEATURES=$(echo "$COMMIT_MESSAGES" | grep -E "^- (機能|改善):" |
            sed 's/^- [^:]*: /• /' | head -4)

          # 修正を抽出
          FIXES=$(echo "$COMMIT_MESSAGES" | grep "^- 修正:" |
            sed 's/^- 修正: /• /' | head -4)

          NOTES=""
          if [ -n "$FEATURES" ]; then
            NOTES="🆕 **主な改善**\n${FEATURES}"
          fi
          if [ -n "$FIXES" ]; then
            [ -n "$NOTES" ] && NOTES="${NOTES}\n\n"
            NOTES="${NOTES}🐛 **修正**\n${FIXES}"
          fi

          if [ -z "$NOTES" ]; then
            echo "notes=SKIP" >> "$GITHUB_OUTPUT"
          else
            echo "notes<<EOF" >> "$GITHUB_OUTPUT"
            echo -e "$NOTES" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi
          echo "::notice::📝 Release notes generated by fallback (no AI)"

      - name: Resolve final notes
        id: final-notes
        env:
          AI_NOTES: ${{ steps.release-notes.outputs.notes }}
          FB_NOTES: ${{ steps.fallback-notes.outputs.notes }}
        run: |
          if [ -n "$AI_NOTES" ] && [ "$AI_NOTES" != "SKIP" ]; then
            FINAL="$AI_NOTES"
          elif [ -n "$FB_NOTES" ] && [ "$FB_NOTES" != "SKIP" ]; then
            FINAL="$FB_NOTES"
          else
            FINAL="SKIP"
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FINAL" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Post release notes to Discord
        if: steps.final-notes.outputs.notes != '' && steps.final-notes.outputs.notes != 'SKIP'
        env:
          WEBHOOK_URL: ${{ vars.DISCORD_RELEASE_NOTES_WEBHOOK_URL }}
          NOTES: ${{ steps.final-notes.outputs.notes }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_RELEASE_NOTES_WEBHOOK_URL is not set. Skipping Discord notification."
            exit 0
          fi
          DATE_JP=$(date -u +"%Y年%-m月%-d日")
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"🎉 アップデートのお知らせ\",
                \"description\": $(echo -e "$NOTES\n\nご意見・ご要望は **設定 > フィードバック** からどうぞ！" | jq -Rs .),
                \"color\": 5763719,
                \"footer\": {\"text\": \"がんばりクエスト • ${DATE_JP}\"}
              }]
            }"

  notify:
    needs: [deploy, e2e-production]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify deployment result (Discord)
        if: vars.DISCORD_WEBHOOK_URL != ''
        env:
          WEBHOOK_URL: ${{ vars.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ needs.deploy.result }}
          E2E_STATUS: ${{ needs.e2e-production.result }}
          VERSION: ${{ needs.deploy.outputs.version }}
        run: |
          if [ "$STATUS" = "success" ] && [ "$E2E_STATUS" != "failure" ]; then
            COLOR=3066993
            TITLE="Deploy Success"
            DESC="Version \`$VERSION\` deployed to production"
          else
            COLOR=15158332
            TITLE="Deploy Failed"
            DESC="Version \`$VERSION\` deployment failed (deploy: $STATUS, e2e: $E2E_STATUS)"
          fi
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"$TITLE\",
                \"description\": \"$DESC\",
                \"color\": $COLOR,
                \"fields\": [
                  {\"name\": \"Commit\", \"value\": \"\`$(echo ${{ github.sha }} | cut -c1-7)\`\", \"inline\": true},
                  {\"name\": \"Author\", \"value\": \"${{ github.actor }}\", \"inline\": true},
                  {\"name\": \"Branch/Tag\", \"value\": \"${{ github.ref_name }}\", \"inline\": true}
                ]
              }]
            }"
