# graphify-refresh.yml — Issue #4536
#
# develop 上の graphify-out (`graph.json` 等) を push 契機で最新に保つ。
#
# 背景: `graphify-out/**` は git 追跡している (coldstart 解消、docs/CLAUDE.md §graphify)。
# 以前は全 branch でコミットのたびに `.husky/post-commit` が再生成していたため、並行する
# feature branch がそれぞれ独自の graphify-out を持ち、develop への merge のたびに
# 残り全 PR が graphify-out だけで conflict していた (実測: PR #4514 merge 時、conflict は
# graphify-out 3 file のみ)。
#
# 対策: `.husky/post-commit` は develop/main 以外での再生成を止めた (#4536)。develop 上の
# 再生成は本 workflow が push 契機で担う。develop / main は branch ruleset で直接 push を
# 拒否する (required review) ため、hotfix-back-merge.yml と同じ「bot が branch + PR を発行し
# QM/lab が承認する」経路を使う (ADR-0022 準拠、admin bypass なし)。
#
# 無限 loop 防止: 本 workflow が発行した PR が merge されると graphify-out のみが変更された
# push イベントが発生するが、`paths-ignore: graphify-out/**` が全変更ファイルそれを除外する
# push を skip するため再トリガーしない。
#
# 設計原則:
#   - 新しい CI check (hard-fail gate) は追加しない。既存の develop 軽量レーン gate に
#     乗るだけの通常 PR (装置を増やさない、platform session 憲章 §3.4)。
#   - 差分が無ければ PR を発行しない (無駄な PR を積まない)。
#   - branch (`chore/graphify-refresh`) は upsert (再利用)。前回の未 merge PR があれば
#     最新 develop 基点で作り直す (back-merge と同型、PR 積み上がり防止)。

name: graphify-refresh

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'graphify-out/**'
  workflow_dispatch: {}

concurrency:
  group: graphify-refresh-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  refresh:
    name: graphify-out 再生成 + bot PR 発行
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          # PR 発行は後段で App install トークンを使う。checkout は既定 token で十分。
          token: ${{ secrets.GITHUB_TOKEN }}
          # 既定 (true) だと GITHUB_TOKEN が .git/config の http.extraheader に残り、後段の
          # `git push "https://x-access-token:<App token>@…"` でも extraheader が優先されて
          # github-actions[bot] (contents: read) として push → 403 になる (#4536 導入以来 1 度も
          # 成功していなかった、2026-09-03 実測)。以降の step は local の git status と App token の
          # gh / git push しか使わないので、checkout の資格情報は残さない。
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      # graphifyy (PyPI、graphify CLI の配布名) を install する。`update` は AST 抽出のみで
      # LLM を呼ばない ("no LLM needed"、docs/decisions/README.md §OSS 採用記録) ため secret 不要。
      #
      # version pin 必須 (QM 指摘、#4536): 本 job は同一 runner 内で pip install の直後に
      # INTEGRATION_BOT_APP_PRIVATE_KEY から短命 install token を発行する (develop へ push 可能)。
      # unpinned PyPI package が乗っ取られると、その token を奪う経路になる。0.9.32 は
      # `graphify --help` / `graphify update .` の CLI surface を本 PR 作成時に実機確認済みの版。
      # 更新する場合は新版で `graphify update .` の出力 (graph.json / manifest.json /
      # GRAPH_REPORT.md) を手元で確認してから version 文字列だけを差し替える。
      #
      # **依存も含めて exact pin する (#4853 adversarial 指摘)**。上の脅威モデルを自分で
      # 書いておきながら、pin は最上位だけで、runtime 依存 29 件 (`networkx>=3.4` /
      # `numpy>=1.21` / `rapidfuzz>=3.0` + tree-sitter grammar 26 件、いずれも native wheel)
      # はすべて範囲指定だった。**範囲指定は「その範囲に将来公開される版」を無条件に信用する**
      # ので、脅威モデルの経路は開いたままだった。node 側には `npm ci --ignore-scripts` が
      # あるのに python 側に同等の遮断が無い、という非対称でもあった。
      #
      # ここに並ぶ 30 件は、**実際に artifact を生成した run のログから採った解決済みの完全な
      # 閉包**であり、手で書いたものではない (`Successfully installed` 行が version、
      # `Downloading …whl` 行が wheel の実ファイル名。sha256 は PyPI の JSON API から
      # その実ファイル名で引いた)。3 つを重ねて「これ以外は入らない」を pip に強制する:
      #
      #   --require-hashes  … 記載の sha256 と一致する artifact 以外は拒否する。
      #                       **PyPI 上の既存 artifact が差し替えられても入らない**。
      #                       この mode では pip が **依存解決を毎回やり直して**、
      #                       解決した全 dist が list に載っていることを機械検証する。
      #                       1 件でも欠ければ、欠けた dist を名指しして hard-fail する
      #   --only-binary     … sdist からの build (= 任意コード実行) を禁じる
      #
      # **`--no-deps` は付けない** (#4866 adversarial 実測)。初版は付けていて、
      # 「閉包が欠けたら直後の `graphify update .` が import で落ちるので list 自体が
      # 自己検査になる」と書いていたが、**これは嘘だった** — graphifyy の wheel を展開すると
      # tree-sitter 系 26 件の import はすべて `try: … except ImportError: return {nodes: [], …}`
      # の中にあり、**欠けても例外は出ず「その言語の抽出が空になる」だけ**。top-level import で
      # 落ちるのは networkx / numpy / rapidfuzz の 3 件だけで、第 1 稿が networkx で落ちたのは
      # たまたまその 3 件を引いたからにすぎない。
      #
      # A/B 実測: fortran を 1 行抜いた list を `--require-hashes` だけで dry-run すると
      # `tree-sitter-fortran<0.8,>=0.6 from graphifyy==0.9.32` を名指しして hard-fail する。
      # 同じ list に `--no-deps` を足すと 29 件を静かに `Would install` して成功する。
      # つまり `--no-deps` は不要かつ厳密に弱く、「30 件 = 真の閉包」という不変条件を
      # **pip の毎回の機械検証から、人間の手作業の主張へ格下げしていた**。
      #
      # **action 側も同じ理由で SHA pin にした** (#4866 adversarial 指摘)。App install token を
      # 発行する**前に** `checkout` / `setup-python` / `setup-node` の 3 本が同一 job で走るので、
      # 可変 tag のままだと「pin した python 依存」の隣に「pin していない任意コード」が残る。
      # `create-github-app-token` / `github-script` は元から SHA pin されていた。
      #
      # **hash は platform 依存**。native wheel (numpy / rapidfuzz / tree-sitter 各種) は
      # `cp312` + `manylinux x86_64` の実ファイルを指しているので、上の `setup-python` の
      # 3.12 と ubuntu-latest x86_64 が前提。runner が変わると install が**落ちる** —
      # 黙って別物が入るより落ちるほうが正しいので、そう設計している。
      #
      # ## version を上げるときの手順 (実行前に list を作れる形にしてある)
      #
      # 「上げた run のログから写す」は**鶏と卵**になる (新 version の log を得るには、先に
      # 正しく書き替えた run を成功させねばならない)。加えて Actions の log は既定 90 日で
      # 消えるので、後から hash の出所を再監査できない。**手元で解決だけさせて report を出す**:
      #
      # **1 物理行で書く** (複数行に折ると、コピーしたときに行頭の `# ` が引用符の内側へ
      # 入り、全体が comment 扱いで exit 0 / 出力 0 バイトになる。実際に一度そうなった —
      # 本 workflow が塞ごうとしている「緑なのに何もしていない」そのもの):
      #
      #   docker run --rm --platform=linux/amd64 python:3.12-slim pip install --dry-run --only-binary=:all: --report /dev/stdout "graphifyy==<新 version>" > report.json
      #
      # **`--platform=linux/amd64` は必須**。`python:3.12-slim` は multi-arch なので、
      # ARM ホストで省くと**黙って arm64 wheel の hash** が出る。それを commit すると
      # runner (x86_64) で hash 不一致の hard-fail になり、**graph が無音で stale 化する**
      # (供給網の改善が可用性の単一障害点に振れる経路)。
      #
      # `report.json` の `install[].download_info` に、解決された全 dist の
      # `url` (= wheel 実ファイル名) と `archive_info.hashes.sha256` が入っている。
      # そこから `<name>==<version>` と `--hash=sha256:<...>` を機械的に書き出す。
      #
      # (`pip-compile --generate-hashes` でも同じことができるが、pip-tools を足すことになる)
      - name: Install graphify (graphifyy on PyPI, pinned by hash with its full dependency closure)
        run: |
          set -euo pipefail
          cat > /tmp/graphify-requirements.txt <<'REQ'
          graphifyy==0.9.32 \
              --hash=sha256:7df67ab3bdd472a51243e61d3b0455ddd8f1c3c5a6f7945c33c7b291ed31a280
          networkx==3.6.1 \
              --hash=sha256:d47fbf302e7d9cbbb9e2555a0d267983d2aa476bac30e90dfbe5669bd57f3762
          numpy==2.5.3 \
              --hash=sha256:b7e18c623bb5c95acb3b3328861272816ba199fb531921c5d6d0b675f1fde9e3
          rapidfuzz==3.14.6 \
              --hash=sha256:0debb5f43662ea84d2f0228a0c7407ff647f9c3d13f3b692efff0cde46eebce0
          tree-sitter-bash==0.25.1 \
              --hash=sha256:3f484c4bb8796cde7a87ca351e6116f09653edac0eb3c6d238566359dd28b117
          tree-sitter-c-sharp==0.23.5 \
              --hash=sha256:aa88a780204cd153c4c1ae2d59c654cee1402212fa0d069823d6d34301587438
          tree-sitter-c==0.24.2 \
              --hash=sha256:5041ef67eb68ce6bc8bb0b1f8ef3a5585ce523dae0c7eec109ab0627dd75aede
          tree-sitter-cpp==0.23.4 \
              --hash=sha256:773d2cafc08bbc0f998687fa33f42f378c1a371cdb582870c4d13abb06092706
          tree-sitter-elixir==0.3.5 \
              --hash=sha256:ebfe3491a3d00ac50b12a3bfcabb1c564f3809ed8a095099fe87f49d6b3987e6
          tree-sitter-fortran==0.6.0 \
              --hash=sha256:ac4800b4abc1b25e6e7ab4a3f2eae274c5b19107beb18d3a473c0f67509c7486
          tree-sitter-go==0.25.0 \
              --hash=sha256:04b3b3cb4aff18e74e28d49b716c6f24cb71ddfdd66768987e26e4d0fa812f74
          tree-sitter-groovy==0.1.2 \
              --hash=sha256:9e938e9c2cd5fdb08fd1b28d7d621d15ea959a17a4bc0b77833e07a94fe7d263
          tree-sitter-java==0.23.5 \
              --hash=sha256:370b204b9500b847f6d0c5ad584045831cee69e9a3e4d878535d39e4a7e4c4f1
          tree-sitter-javascript==0.25.0 \
              --hash=sha256:9dc04ba91fc8583344e57c1f1ed5b2c97ecaaf47480011b92fbeab8dda96db75
          tree-sitter-json==0.24.8 \
              --hash=sha256:85cca779872f7278f3a74eb38533d34b9c4de4fd548615e3361fa64fe350ad0a
          tree-sitter-julia==0.23.1 \
              --hash=sha256:7d4f6ae938198fc0be9b6ea76313ade24fcdb89be01a791e0cc90c88fae5743d
          tree-sitter-kotlin==1.1.0 \
              --hash=sha256:9a92afe24b634cf914c5812af0f5c53184b1c18bdf6ee5505c83afac81f6bf6c
          tree-sitter-lua==0.5.0 \
              --hash=sha256:5ec448c854fea32414a0449147d648bc5baddf7a0357008c4abe3269db35370a
          tree-sitter-objc==3.0.2 \
              --hash=sha256:e71282ac9c096a966bf2fa6a4ecdbea4bd037d3e01ea4aa9bbc64d9a4c0022f6
          tree-sitter-php==0.24.1 \
              --hash=sha256:7a1404a30f2972498ace040b0029738b8dac45d0a12932ccb8b605eb94bafbe4
          tree-sitter-powershell==0.26.4 \
              --hash=sha256:56508e4ac7aad1e3b26f2ef96b8d2b60b149c4efa0c23742e91e809a11db73ee
          tree-sitter-python==0.25.0 \
              --hash=sha256:86f118e5eecad616ecdb81d171a36dde9bef5a0b21ed71ea9c3e390813c3baf5
          tree-sitter-ruby==0.23.1 \
              --hash=sha256:f7bcd93972b4ca2803856d4fe0fbd04123ff29c4592bbb9f12a27528bd252341
          tree-sitter-rust==0.24.2 \
              --hash=sha256:e033c5a93b57c88e0a835880de39fc802909ff69f57aaff6000211c196ea5190
          tree-sitter-scala==0.26.2 \
              --hash=sha256:0e68e55c50fa7e7f2866ce7ca590df8df6407dd7a85e484e9f20e974cbc6d8f2
          tree-sitter-swift==0.7.3 \
              --hash=sha256:f38feeb4f7350c8b30d567a0dc08bf1eeaa67c241b6888d72a45a8b1a4aa7187
          tree-sitter-typescript==0.23.2 \
              --hash=sha256:e96d36b85bcacdeb8ff5c2618d75593ef12ebaf1b4eace3477e2bdb2abb1752c
          tree-sitter-verilog==1.0.3 \
              --hash=sha256:747dd7d4bc95fb389bc37225f82d16f0c40549856e9a244be3ff9d7bfe62b730
          tree-sitter-zig==1.1.2 \
              --hash=sha256:e924509dcac5a6054da357e3d6bcf37ea82984ee1d2a376569753d32f61ea8bb
          tree-sitter==0.25.2 \
              --hash=sha256:b43a9e4c89d4d0839de27cd4d6902d33396de700e9ff4c5ab7631f277a85ead9
          REQ
          pip install --require-hashes --only-binary=:all: -r /tmp/graphify-requirements.txt

      # graphify 0.9.32 は tsconfig.json の `extends: ./.svelte-kit/tsconfig.json` を辿って
      # `$lib` alias を解決するが、生成物が無いと無言で skip し、`$lib/...` を擬似 file node にして
      # import / call 系 edge を落とす (実測: 同一ソースで edge -22.5% / 擬似 node 203、adv-4827)。
      # 手元の graphify-out は .svelte-kit が揃った状態で作られているので、CI でも
      # `svelte-kit sync` で同じ前提を作ってから再生成する。
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Generate .svelte-kit/tsconfig.json ($lib alias の解決に必要)
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          # --no-install: npm ci が @sveltejs/kit を入れているので registry を引く必要はない。
          # App token を発行する job 内に「無い時に取りに行く」経路を残さない (adv-4837 指摘)
          npx --no-install svelte-kit sync
          test -f .svelte-kit/tsconfig.json

      # #4866 adversarial (UX must): 承認者が見る diff は 27MB の graph.json で**人間には読めない**。
      # 承認判断は事実上この job の assertion だけに依存しているのに、floor が「node 0 件でない」
      # しか無かった。grammar が 1 つ欠けて .ts 由来 node がまるごと消えた graph でも、
      # install 緑・regenerate 緑・assert 緑で bot PR が発行され、承認者には「読めない巨大 diff +
      # 全部緑」しか提示されない (#4827 / #4830 / #4833 で実際に edge が 22% 減った graph が
      # 黙って PR にされ続けた)。**再生成の前に、いま develop に入っている graph の規模を控える。**
      - name: Record committed graph size (再生成前の baseline)
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const g = JSON.parse(fs.readFileSync("graphify-out/graph.json", "utf8"));
            const nodes = Array.isArray(g.nodes) ? g.nodes.length : 0;
            const edges = Array.isArray(g.links) ? g.links.length : Array.isArray(g.edges) ? g.edges.length : 0;
            const envFile = process.env.GITHUB_ENV;
            fs.appendFileSync(envFile, "BASELINE_NODES=" + nodes + "\n");
            fs.appendFileSync(envFile, "BASELINE_EDGES=" + edges + "\n");
            console.log(`baseline: node ${nodes} / edge ${edges}`);
          '

      - name: Regenerate knowledge graph
        run: graphify update .

      # fail-closed: `$lib` alias が解けていれば擬似 file node は 0 になる。1 件でも出たら
      # 上の `svelte-kit sync` が効いていない (= 低忠実度 graph) ので、bot PR を発行せず落とす。
      # これが無いと「edge が 22% 減った graph」を bot が黙って PR にし続ける (#4827 / #4830 / #4833)。
      - name: Assert $lib alias resolved (擬似 node 0)
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const g = JSON.parse(fs.readFileSync("graphify-out/graph.json", "utf8"));
            const nodes = Array.isArray(g.nodes) ? g.nodes : [];
            if (nodes.length === 0) throw new Error("graph.json に node がありません (生成に失敗)");
            // 擬似 node は「source_file が $lib/ で始まる」形で出る (実測: 低忠実度 graph 203 件すべて)。
            // slash 込みで前方一致に絞る — slash 無しだと tsconfig.depcruise.json の paths key `$lib` と
            // .cspell.json の正規表現を巻き込んで偽陽性になる (どちらも alias 解決とは無関係)。
            const pseudo = nodes.filter((n) => String(n.source_file ?? "").startsWith("$lib/"));
            if (pseudo.length > 0) {
              console.error("::error::$lib 擬似 node が " + pseudo.length + " 件あります (例: " + String(pseudo[0].source_file) + ")。tsconfig の $lib alias が解決されていません — 直前の svelte-kit sync が失敗したか、tsconfig.json の extends / paths が変わった可能性があります。低忠実度の graph なので bot PR は発行しません。");
              process.exit(1);
            }
            console.log("node " + nodes.length + " / $lib 擬似 node 0 — alias 解決 OK");

            // #4866: 規模が大きく縮んだら止める。grammar 欠落 / 抽出失敗は「例外」ではなく
            // 「その言語の抽出が空」として現れる (tree-sitter 系は try/except の中で import
            // されている) ため、**縮みを数で見る以外に気づく方法が無い**。
            const links = Array.isArray(g.links) ? g.links : Array.isArray(g.edges) ? g.edges : [];
            const baseNodes = Number(process.env.BASELINE_NODES || 0);
            const baseEdges = Number(process.env.BASELINE_EDGES || 0);
            const FLOOR = 0.9; // 10% を超えて縮んだら人間に見せる

            // **baseline が取れないときは fail-closed** (#4084 の判断と同じ class)。
            // baseline step は `g.links ?? g.edges` と key 名の不安定さを前提にしているので、
            // 将来 graphify が `links` を改名すれば 0 が書かれる。そのとき「規模 OK」を
            // 出して通すと、**検査が無音で消えたまま緑が続く** — この workflow が別 step で
            // `|| true` の fail-open を名指しで戒めているのと同じ理由で、ここも倒す側にする。
            if (!(baseNodes > 0) || !(baseEdges > 0)) {
              console.error("::error::再生成前の graph 規模を取得できませんでした "
                + "(node=" + baseNodes + " / edge=" + baseEdges + ")。縮み検査が成立しないので "
                + "bot PR は発行しません。graph.json の key 名 (nodes / links) が変わった可能性が "
                + "あります — baseline step の読み取りを実装に合わせてください。");
              process.exit(1);
            }

            const shrunk = [];
            if (nodes.length < baseNodes * FLOOR) {
              shrunk.push("node " + baseNodes + " -> " + nodes.length);
            }
            if (links.length < baseEdges * FLOOR) {
              shrunk.push("edge " + baseEdges + " -> " + links.length);
            }
            if (shrunk.length > 0) {
              console.error("::error::graph が 10% を超えて縮みました (" + shrunk.join(" / ") + ")。"
                + "grammar の欠落や抽出失敗は例外にならず『その言語が空』として出るため、"
                + "数でしか気づけません。bot PR は発行しません — 依存 pin / graphify version / "
                + "対象ファイルの増減のどれが原因かを確認してください。"
                + "**意図した縮みだったときの復旧手順**: develop は直接 push を拒否するので、"
                + "手元で `graphify update .` を実行し、その差分で PR を出して QM/lab に "
                + "承認してもらう (縮んだ理由を PR body に書く)。この step の FLOOR を "
                + "下げて通すのではなく、人が一度見る。");
              process.exit(1);
            }
            console.log("規模 OK: node " + nodes.length + " (baseline " + baseNodes + ") / edge "
              + links.length + " (baseline " + baseEdges + ")");
          '

      - name: Detect graphify-out diff
        id: diff
        run: |
          set -euo pipefail
          # 差分は graph.json だけで判定する。manifest.json は file ごとの mtime (= checkout 時刻) を
          # 持つため毎 run 必ず変わり (実測 70% が mtime のみ)、GRAPH_REPORT.md は HEAD commit を
          # 埋め込む。
          #
          # graph.json が「同じソースなら変わらない」のは、graphify 自身が topology 同一と判定した
          # ときに graph.json を書き直さないため (adv-4837 実測: 同一入力 2 回で node / edge 集合は
          # 一致するが community 割当は非決定的で、書き直せば md5 は変わる)。**graph.json の中身が
          # 決定的なのではない**。graphify の version を上げるときは、この短絡が残っているかを
          # 手元で確認する (無くなると毎 push で空 PR が出る)。
          if ! git diff --quiet -- graphify-out/graph.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain -- graphify-out
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "graphify-out に差分なし。PR は発行しない。"
          fi

      # ----------------------------------------------------------------------
      # 差分がある場合のみ、bot PR を発行する (App 認証情報が無ければ drift を通知)
      # ----------------------------------------------------------------------
      # App install token を発行する前に、working tree が graphify-out 以外で汚れていないことを
      # 確認する。本 job は token 発行の前に `npm ci` で 1300+ package を展開し `svelte-kit sync` /
      # `graphify update` を走らせる (adv-4837 指摘)。--ignore-scripts で postinstall は止めているが、
      # それ以外の経路で tree が書き換わったまま token を渡すと、後段の `git add graphify-out` /
      # `gh` 実行に持ち込まれる。graphify-out 以外に変更があれば token を出さずに落とす。
      - name: Assert working tree clean outside graphify-out
        run: |
          set -euo pipefail
          # `git status | grep -v ... || true` と書くと git 自体の失敗まで `|| true` が飲み込み、
          # tree が汚れていても検査が通る (fail-open)。git の終了 status を先に確定させてから絞る。
          if ! STATUS=$(git status --porcelain); then
            echo "::error::git status に失敗しました。App token を発行せず中止します。"
            exit 1
          fi
          # grep の `|| true` は「一致行が無い = clean」の正常系を拾うためのもの。
          # git の失敗は上で先に落としてあるので、ここで fail-open にはならない。
          DIRTY=$(echo "${STATUS}" | grep -v '^.. graphify-out/' || true)
          if [ -n "${DIRTY}" ]; then
            echo "::error::graphify-out 以外に変更があります。App token を発行せず中止します:"
            echo "${DIRTY}"
            exit 1
          fi
          # 成功時も無言にしない。特権 token を発行した時点の tree 状態を後から示せるようにする
          # (監査証跡。何も出力しないと「検査が動いたのか」自体が log から分からない)
          echo "working tree は graphify-out/ 以外に変更なし — App token 発行に進みます"
          git status --porcelain -- graphify-out | sed 's/^/  /'

      - name: Verify GitHub App credentials presence
        id: appcreds
        if: steps.diff.outputs.changed == 'true'
        env:
          APP_ID: ${{ secrets.INTEGRATION_BOT_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.INTEGRATION_BOT_APP_PRIVATE_KEY }}
        run: |
          if [ -n "${APP_ID:-}" ] && [ -n "${APP_PRIVATE_KEY:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub App 認証情報 (INTEGRATION_BOT_APP_ID / INTEGRATION_BOT_APP_PRIVATE_KEY) 未設定。graphify-refresh PR を発行できない。develop の graphify-out が stale のまま残る (#4536)。"
          fi

      - name: Generate GitHub App token
        id: app-token
        if: steps.diff.outputs.changed == 'true' && steps.appcreds.outputs.present == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.INTEGRATION_BOT_APP_ID }}
          private-key: ${{ secrets.INTEGRATION_BOT_APP_PRIVATE_KEY }}

      - name: Resolve App bot identity (commit author)
        id: bot-identity
        if: steps.diff.outputs.changed == 'true' && steps.appcreds.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Commit + push graphify-out (branch upsert)
        id: push
        if: steps.diff.outputs.changed == 'true' && steps.appcreds.outputs.present == 'true'
        env:
          GIT_AUTHOR_NAME: ${{ steps.bot-identity.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.bot-identity.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.bot-identity.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.bot-identity.outputs.email }}
          BRANCH: chore/graphify-refresh
        run: |
          set -euo pipefail
          DEVELOP_SHA=$(git rev-parse HEAD)
          echo "develop_sha=${DEVELOP_SHA}" >> "$GITHUB_OUTPUT"
          git switch -C "$BRANCH"
          git add graphify-out
          git commit -m "chore(graphify): regenerate knowledge graph (develop ${DEVELOP_SHA:0:7}, #4536)"
          # push 先 branch を fetch していないため素の `--force-with-lease` は使えない (#4563)。
          # 追跡参照が無いと lease は「人が進めた」ではなく「過去の値を知らない」で常に
          # stale info になり、2 回目以降の run が永久に失敗する (bare repo で再現確認済み)。
          #
          # 2 段で守る:
          #   1. remote tip の作者が bot 自身か        … 判定時点で人手の commit が載っていないこと
          #   2. --force-with-lease=<ref>:<expect>     … 判定から push までの間に誰も push していないこと
          # 1 だけだと判定後の窓に入った push を黙って消す。2 は明示 lease 値なので追跡参照が無くても効く。
          REMOTE_URL="https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git"
          # ls-remote の一過性失敗で set -e により生の非ゼロ終了になるのを避ける
          # (裸の代入は条件部でないため -e の対象。#4520 で実測した class と同じ)。
          if ! REMOTE_SHA=$(git ls-remote "$REMOTE_URL" "refs/heads/${BRANCH}" | cut -f1); then
            echo "::error::${BRANCH} の現在値を取得できませんでした (GitHub API の一過性障害の可能性)。次の develop push で再試行されます。"
            exit 1
          fi
          if [ -n "${REMOTE_SHA}" ]; then
            git fetch --depth=1 "$REMOTE_URL" "${BRANCH}"
            TIP_EMAIL=$(git log -1 --format=%ae FETCH_HEAD)
            if [ "${TIP_EMAIL}" != "${GIT_AUTHOR_EMAIL}" ]; then
              echo "::error::${BRANCH} の先頭 commit が bot 以外 (${TIP_EMAIL}) です。push を中止しました。bot PR に入れた人手の修正を消さないためです。内容を取り込むか、不要なら ${BRANCH} を削除してください。"
              exit 1
            fi
            git push "$REMOTE_URL" "${BRANCH}" --force-with-lease="refs/heads/${BRANCH}:${REMOTE_SHA}"
          else
            git push "$REMOTE_URL" "${BRANCH}"
          fi

      - name: Upsert graphify-refresh PR
        if: steps.diff.outputs.changed == 'true' && steps.appcreds.outputs.present == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: chore/graphify-refresh
          DEVELOP_SHA: ${{ steps.push.outputs.develop_sha }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { execFileSync } = require('node:child_process');
            const { owner, repo } = context.repo;
            const branch = process.env.BRANCH;
            const sha = process.env.DEVELOP_SHA;

            const title = 'chore(graphify): develop の knowledge graph を再生成 (#4536)';
            const body = execFileSync(
              'node',
              ['scripts/graphify-refresh-pr-body.mjs', '--branch', branch, '--sha', sha],
              { encoding: 'utf8' },
            );

            const existing = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${branch}`, base: 'develop',
            });

            let prNumber;
            if (existing.data.length > 0) {
              prNumber = existing.data[0].number;
              await github.rest.pulls.update({ owner, repo, pull_number: prNumber, title, body });
              core.info(`既存 graphify-refresh PR #${prNumber} を更新 (upsert)`);
            } else {
              const created = await github.rest.pulls.create({
                owner, repo, title, body, head: branch, base: 'develop',
              });
              prNumber = created.data.number;
              core.info(`graphify-refresh PR #${prNumber} を新規作成`);
            }

            try {
              await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: ['type:infra'] });
            } catch (e) {
              core.warning(`label 付与 skip: ${e.message}`);
            }

      - name: Drift summary (job summary)
        if: always() && steps.diff.outputs.changed == 'true'
        env:
          CREDS_PRESENT: ${{ steps.appcreds.outputs.present }}
        run: |
          {
            echo "### graphify-refresh (#4536)"
            echo ""
            if [ "${CREDS_PRESENT}" = "false" ]; then
              echo "- 状態: ⚠️ GitHub App 認証未設定で PR 未発行 = **drift**。develop の graphify-out が stale。"
            else
              echo "- 状態: ✅ graphify-refresh PR を upsert 済 (QM/lab の承認待ち)。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
