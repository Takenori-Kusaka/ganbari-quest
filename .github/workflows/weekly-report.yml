name: Weekly Operations Report

on:
  schedule:
    - cron: '0 0 * * 1' # 毎週月曜 0:00 UTC (= 09:00 JST)
  workflow_dispatch: # 手動実行

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_IAMROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Collect AWS costs (Cost Explorer)
        id: aws-costs
        run: |
          START=$(date -d 'last Monday' +%Y-%m-%d)
          END=$(date -d 'last Sunday + 1 day' +%Y-%m-%d)
          START_JP=$(date -d "$START" +"%Y年%-m月%-d日")
          END_JP=$(date -d 'last Sunday' +"%Y年%-m月%-d日")
          NEXT_JP=$(date -d "next Monday" +"%Y年%-m月%-d日")

          RESULT=$(aws ce get-cost-and-usage \
            --time-period Start=$START,End=$END \
            --granularity WEEKLY \
            --group-by Type=DIMENSION,Key=SERVICE \
            --metrics UnblendedCost \
            --query 'ResultsByTime[0].Groups' \
            --output json 2>/dev/null || echo '[]')

          echo "costs=$(echo "$RESULT" | jq -c '.')" >> "$GITHUB_OUTPUT"
          echo "start_jp=$START_JP" >> "$GITHUB_OUTPUT"
          echo "end_jp=$END_JP" >> "$GITHUB_OUTPUT"
          echo "next_jp=$NEXT_JP" >> "$GITHUB_OUTPUT"

      - name: Resolve DSQL endpoint (production)
        run: |
          ENDPOINT=$(aws cloudformation describe-stacks --stack-name GanbariQuestDsql \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ClusterEndpoint'].OutputValue" --output text)
          if [ -z "$ENDPOINT" ] || [ "$ENDPOINT" = "None" ]; then
            echo "::error::DSQL の ClusterEndpoint を取得できませんでした"
            exit 1
          fi
          echo "DSQL_ENDPOINT=$ENDPOINT" >> "$GITHUB_ENV"

      # テナント統計は /ops ダッシュボードと同じ導出 (ops-service の getKpiSummary) で DSQL から読む (#4962)。
      # 取得に失敗しても費用・売上の節は届け、利用状況の節には失敗を明記する (古い値や 0 を出さない)。
      # 失敗は最後の step で job を赤にして知らせる。
      - name: Collect tenant stats (DSQL, /ops と同じ導出)
        id: tenant-stats
        continue-on-error: true
        env:
          DATA_SOURCE: dsql
        run: |
          npx svelte-kit sync
          npx tsx scripts/ops-kpi-summary.ts \
            --out "$RUNNER_TEMP/ops-kpi.json" \
            --text-out "$RUNNER_TEMP/ops-kpi.txt"
          echo "mrr=$(jq '.tenantStats.totalMrr' "$RUNNER_TEMP/ops-kpi.json")" >> "$GITHUB_OUTPUT"

      - name: Collect Stripe revenue
        id: stripe-revenue
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "total=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          START_TS=$(date -d 'last Monday' +%s)
          END_TS=$(date -d 'last Sunday 23:59:59' +%s)

          RESULT=$(curl -s "https://api.stripe.com/v1/invoices?status=paid&created[gte]=${START_TS}&created[lte]=${END_TS}&limit=100" \
            -u "${STRIPE_SECRET_KEY}:" 2>/dev/null || echo '{"data":[]}')

          COUNT=$(echo "$RESULT" | jq '.data | length')
          TOTAL=$(echo "$RESULT" | jq '[.data[].amount_paid] | add // 0')

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Format and send Discord report
        env:
          # #4994: webhook URL は Secret (Variable はログでマスクされない)
          WEBHOOK_URL: ${{ secrets.DISCORD_WEEKLY_REPORT_WEBHOOK_URL }}
          COSTS_JSON: ${{ steps.aws-costs.outputs.costs }}
          START_JP: ${{ steps.aws-costs.outputs.start_jp }}
          END_JP: ${{ steps.aws-costs.outputs.end_jp }}
          NEXT_JP: ${{ steps.aws-costs.outputs.next_jp }}
          TENANT_STATS_OUTCOME: ${{ steps.tenant-stats.outcome }}
          MRR: ${{ steps.tenant-stats.outputs.mrr }}
          STRIPE_COUNT: ${{ steps.stripe-revenue.outputs.count }}
          STRIPE_TOTAL: ${{ steps.stripe-revenue.outputs.total }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEEKLY_REPORT_WEBHOOK_URL secret is not set. Skipping."
            exit 0
          fi

          # AWS 費用（円換算: 1USD=150円）。サービスを固定で列挙せず、費用の大きい順に上位 5 件 +
          # その他を出し、合計は全サービスの和にする（列挙から漏れたサービスが合計から消えないように）。
          TOTAL_JPY=$(echo "$COSTS_JSON" | jq '[.[].Metrics.UnblendedCost.Amount | tonumber] | add // 0 | . * 150 | round')
          COST_SEC=$(echo "$COSTS_JSON" | jq -r --arg total "$TOTAL_JPY" '
            [.[] | {svc: .Keys[0], usd: (.Metrics.UnblendedCost.Amount | tonumber)}]
            | sort_by(-.usd) as $all
            | [($all[:5][] | "\(.svc) : ¥ \(.usd * 150 | round)")]
              + (if ($all | length) > 5 then ["その他 : ¥ \([$all[5:][].usd] | add * 150 | round)"] else [] end)
              + ["合計 : ¥ \($total)"]
            | join("\n")')

          if [ "$TENANT_STATS_OUTCOME" = "success" ] && [ -s "$RUNNER_TEMP/ops-kpi.txt" ]; then
            TENANT_SEC=$(cat "$RUNNER_TEMP/ops-kpi.txt")
            SUMMARY_SEC=$(printf 'MRR概算 (月)  : ¥ %s\n今週のAWS費用 : ¥ %s' "$MRR" "$TOTAL_JPY")
          else
            TENANT_SEC="取得に失敗しました (DSQL)。GitHub Actions の Weekly Operations Report のログを確認してください"
            SUMMARY_SEC=$(printf 'MRR概算 (月)  : 取得失敗\n今週のAWS費用 : ¥ %s' "$TOTAL_JPY")
          fi

          STRIPE_SEC=$(printf '決済件数 : %s 件\n売上合計 : ¥ %s' "$STRIPE_COUNT" "$STRIPE_TOTAL")

          # Discord embed（jq でJSON構築。--arg は "\n" を解釈しないため、各節は実改行で組み立てる）
          EMBED=$(jq -n \
            --arg title "📊 週次レポート（${START_JP} 〜 ${END_JP}）" \
            --arg tenant_sec "$TENANT_SEC" \
            --arg cost_sec "$COST_SEC" \
            --arg stripe_sec "$STRIPE_SEC" \
            --arg summary_sec "$SUMMARY_SEC" \
            --arg next "🗓 次回レポート: ${NEXT_JP}（月）" \
            '{
              title: $title,
              color: 3447003,
              fields: [
                { name: "👥 利用状況", value: ("```\n" + $tenant_sec + "\n```"), inline: false },
                { name: "💰 先週のAWSコスト（概算）", value: ("```\n" + $cost_sec + "\n```"), inline: false },
                { name: "💳 Stripe 売上（先週）", value: ("```\n" + $stripe_sec + "\n```"), inline: false },
                { name: "📈 サマリー", value: ("```\n" + $summary_sec + "\n```"), inline: false }
              ],
              footer: { text: ($next + " • AWS Cost Explorer (概算 $1=¥150)") },
              timestamp: (now | todate)
            }')

          curl -sf -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --argjson embed "$EMBED" '{embeds: [$embed]}')"

          echo "✅ Weekly report sent to Discord"

      - name: Fail if tenant stats could not be collected
        if: steps.tenant-stats.outcome == 'failure'
        run: |
          echo "::error::テナント統計 (DSQL) の取得に失敗しました。レポートは失敗の旨を明記して送信済みです"
          exit 1
