name: "Dependency Review"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    # #2931 / branch-strategy.md §4: 軽量レーン（高速 + 依存脆弱性は per-PR で検知価値が高い）。
    # develop 向け PR でも発火する。
    branches: [main, develop]
    # #1218: ready_for_review は除外（Draft でも走るため再実行は無駄）。
    types: [opened, synchronize, reopened]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'infra/package.json'
      - 'infra/package-lock.json'

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # 既定値と同値だが、下の waiver の根拠が「development scope は元々検査対象外」という
          # 前提に依存しているため明示する (v5 src/schemas.ts: fail_on_scopes.default(['runtime']))。
          # 既定が変わったときに waiver の根拠が黙って崩れるのを防ぐ。
          fail-on-scopes: runtime
          # --- waiver (#4017) ---------------------------------------------------------
          # PO 決裁記録 (承認の正本):
          #   https://github.com/Takenori-Kusaka/ganbari-quest/issues/4017#issuecomment-5113776277
          #
          # GHSA-mh99-v99m-4gvg / brace-expansion <= 5.0.7 / DoS via unbounded expansion。
          #
          # 対象は `infra/package-lock.json` の 1 経路のみ (実 job ログで確認済):
          #   aws-cdk-lib の **bundled dependency** として 5.0.7 が同梱される。bundled のため
          #   `overrides` では差し替えられず、patched 5.0.8 を同梱した aws-cdk-lib のリリース待ち。
          #
          # なぜ waiver が必要か:
          #   - `infra/node_modules` は CDK synth 専用で、**本番イメージに一度も install されない**
          #     (Dockerfile が実行する npm ci は root の package*.json のみ。runtime stage も
          #     `infra/` 配下を COPY しない)。よって本 advisory の
          #     brace-expansion は **顧客リクエスト経路に存在しない**。実エクスポージャは CI ランナーと
          #     開発機のビルド時に限られ、glob の入力はリポジトリ内の記述 (攻撃者非制御)
          #   - main 側も 5.0.6 で同じ advisory 範囲 (<= 5.0.7) の中にある。dependency-review は
          #     base↔head の差分しか見ないため、5.0.6 に revert すると **赤だけ消えて脆弱性は残る**
          #   - 本 advisory を放置すると lock を触る PR (Dependabot 含む) が全て赤になり、
          #     統合レーンが無期限に止まる
          #
          # ルート側 (`package-lock.json`) について (誤解防止):
          #   本リポジトリの Dockerfile は runtime stage に devDeps 込みで node_modules を COPY する
          #   ため、**ルート側の brace-expansion は本番イメージのディスク上に存在する**。ただし
          #   server bundle の実行経路から require されず、glob の入力も攻撃者非制御であるため
          #   実エクスポージャは無い (「dev だから載らない」という説明は事実に反するので使わない)。
          #
          # 残存リスク (受容済み):
          #   `allow-ghsas` は GHSA ID 単位で、**path / manifest / scope では絞れない** (v5 の
          #   input / config-file いずれにも該当キー無し)。したがって将来 brace-expansion が
          #   **ランタイム依存**として入っても同 advisory なら本 gate は黙る。この穴は
          #   `tests/unit/infra/dependency-review-waiver.test.ts` が塞ぐ (`[W1]` root lock で非 dev 化
          #   したら fail = 入口を狭める / `[W5]` bundled が 5.0.9 以上になったら「waiver を消せ」に
          #   変わる = 撤去を強制)。
          #
          # 撤去条件: aws-cdk-lib が brace-expansion **5.0.9** 以上を同梱したら lock を上げて
          #   本 waiver・下記の受容記録・`.github/dependabot.yml` の aws-cdk-lib pin・上記 test file を
          #   同じ PR で削除する。到達検知は `[W5]` が機械的に行う。
          #   (5.0.8 は本 advisory の patched だが、下記 GHSA-rgw5-rvv9-x895 の affected なので撤去点にしない)
          #
          # --- 受容記録 (waive しない): GHSA-rgw5-rvv9-x895 -----------------------------
          # brace-expansion / high / CVE-2026-14257 の緩和を bypass する DoS。
          # 実測 (2026-08-07 GitHub Security Advisory API):
          #   vulnerableVersionRange = ">= 4.0.0, < 5.0.9" / firstPatchedVersion = "5.0.9"
          # つまり infra lock に留めている **bundled 5.0.7 も本 advisory の affected** であり、
          # 5.0.7 への据え置きは「新たに 5.0.8 を持ち込まない」だけで脆弱性は解消していない。
          #
          # 受容してよい理由: waiver 対象と同じ経路 (`infra/node_modules` = CDK synth 専用) にしか
          #   存在せず、本番イメージに一度も install されない。攻撃者が到達する入力経路が無い
          #   (glob の入力はリポジトリ内の記述のみ)。
          # 解消条件: aws-cdk-lib が brace-expansion 5.0.9 以上を同梱した版を出したら lock を上げる。
          #   `.github/dependabot.yml` の aws-cdk-lib pin を外すと Dependabot が自動で提案してくる。
          #
          # **`allow-ghsas` には足さない**: 足すと本 advisory はどの経路で入っても gate が黙る。
          #   現に aws-cdk-lib 2.263.0 (bundled 5.0.8) は本 gate が赤で止めた = 検知は今も効いている。
          #   実エクスポージャが無いことは「赤を無視してよい」理由にはなるが「赤を出なくしてよい」
          #   理由にはならないため、受容は本コメントと test (`[W6]`) に記録するに留める。
          allow-ghsas: GHSA-mh99-v99m-4gvg
