name: "Dependency Review"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    # #2931 / branch-strategy.md §4: 軽量レーン（高速 + 依存脆弱性は per-PR で検知価値が高い）。
    # develop 向け PR でも発火する。
    branches: [main, develop]
    # #1218: ready_for_review は除外（Draft でも走るため再実行は無駄）。
    types: [opened, synchronize, reopened]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'infra/package.json'
      - 'infra/package-lock.json'

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # 既定値と同値だが、gate の検査範囲 (runtime scope のみ = root の devDependencies は対象外)
          # を明示して固定する (v5 src/schemas.ts: fail_on_scopes.default(['runtime']))。
          # 既定が変わる / 誰かが development を足すと検査範囲が黙って変わるため、
          # tests/unit/infra/dependency-review-workflow.test.ts が本行と allow-ghsas の不在を固定する。
          fail-on-scopes: runtime
