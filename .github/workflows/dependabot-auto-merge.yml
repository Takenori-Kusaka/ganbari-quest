name: Dependabot auto-merge

# bot lane の SSOT は scripts/pr-lane.mjs の BOT_ACTORS (#2947 / 親 #2942 / EPIC #2861)。
# 「bot とは誰か」(= dependabot lane の actor 集合) の正準定義は BOT_ACTORS = ['dependabot[bot]',
# 'renovate[bot]'] に一本化されており、gate workflow の exempt (pr-template-gate.yml 等の
# `github.event.pull_request.user.login != 'dependabot[bot]'`) も同 SSOT / classifyLane の
# dependabot lane 判定を参照する。
#
# ただし下記 auto-merge の発火条件は **dependabot[bot] のみ** で renovate を含まない (現行仕様、
# #2947 no-go「auto-merge を renovate に拡大しない」)。BOT_ACTORS は「lane = dependabot として
# exempt / 軽量扱いする actor」の定義であり「auto-merge 対象 actor」とは別概念のため、本 workflow
# は意図的に軽量な actor 判定を維持する (composite action actions/pr-lane を挟むと全 PR で
# checkout+node が走りオーバーヘッドが増えるため不採用、#2947 選択肢 B 却下)。
#
# #4133: 判定は PR 作成者 (github.event.pull_request.user.login) を見る。github.actor は
# 「このイベントを起こした人」であり、人間が base 変更や label 付与などで dependabot PR に
# 触れると actor が人間に変わり、この auto-merge が発火しなくなってしまう (gate 挙動の反転)。

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # auto-merge 対象は dependabot[bot] のみ (renovate は対象外、上記コメント参照)。
    # bot lane SSOT = scripts/pr-lane.mjs の BOT_ACTORS。
    # PR 作成者で判定する (actor だと人間が触れた瞬間に判定が反転するため、#4133)。
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      # #4422: 人が dependabot branch を rebase / 追記すると dependabot の commit signature が
      # 失われ (rewrite すると committer が人間になり verification.reason=unsigned になる)、
      # fetch-metadata が「Dependabot's commit signature is not verified」で **job を fail** させる。
      # この拒否自体は正しい (署名を検証できない metadata で auto-merge してはならない) が、
      # 「人が手を入れた PR を auto-merge しない」は本 workflow の意図そのものなので、
      # fail ではなく **auto-merge 対象外 (skip)** として表現する。
      #
      # ここでの判定は「auto-merge の適用対象か」だけで、真正性の検証ではない (検証は引き続き
      # fetch-metadata が担う)。author 名を偽装した commit を積んでも本 step を素通りするだけで、
      # その先の fetch-metadata が従来どおり拒否するため、検査は緩んでいない。
      - name: Detect human commits on the dependabot branch
        id: authorship
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          human=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" --paginate \
            --jq '[.[] | select(.commit.author.name != "dependabot[bot]" or .commit.committer.name != "dependabot[bot]")] | length')
          echo "human-commits=${human}" >> "$GITHUB_OUTPUT"
          if [ "${human}" -gt 0 ]; then
            echo "::notice::人の commit が ${human} 件含まれるため auto-merge の対象外。通常の QM レビューで merge 判断する。"
          fi

      - name: Dependabot metadata
        id: metadata
        # SHA pin 必須 (#3489): pull-requests/contents write + auto-merge 起動 context のため、
        # tag 再付け替え時の出力偽造 (update-type 偽装 → 悪性 bump 自動 merge) を防ぐ。
        if: steps.authorship.outputs.human-commits == '0'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for minor and patch updates
        if: >-
          steps.authorship.outputs.human-commits == '0' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
