name: 機能リクエスト
description: 新機能や改善の提案
title: "[Feature] "
labels: ["type:feat"]
body:
  - type: markdown
    attributes:
      value: |
        機能の提案ありがとうございます。以下の項目を記入してください。

  - type: textarea
    id: customer-value
    attributes:
      label: 顧客価値（誰が・どんな状況で・何を得るか）
      description: |
        この Issue が完了したとき、顧客 / 運営の誰が、どんな状況で、何を得るかを具体的に書いてください。
        「土台提供」「follow-up で本実装」は原則禁止です。段階分割する場合は各段階の顧客価値を明記してください。
      placeholder: |
        例: 「ops 担当者は、不正利用が疑われる IP を確認するときに、/ops 画面で直近 10 分間の検証失敗回数上位を一覧できる」
        例: 「親ユーザーは、子供の週間レポートをダッシュボードで確認でき、どの活動に最も時間を使ったか一目で分かる」
    validations:
      required: true

  - type: textarea
    id: production-definition
    attributes:
      label: 本番で「動く」状態の定義
      description: |
        本番環境（DATA_SOURCE=dynamodb）で、この機能が「動いている」と判断できる観測可能な条件を書いてください。
        URL / 画面 / DynamoDB テーブル / CloudWatch ログ / メトリクス等、具体的に。
      placeholder: |
        例:
        - /ops/audit-log 画面に直近 10 分の検証失敗ログが表示される
        - DynamoDB OpsAuditLog テーブルに action=LICENSE_VERIFY_FAIL のレコードが入る
        - CloudWatch Logs に [AUDIT] prefix のログが出力される
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: ユースケース
      description: この機能はどんな問題を解決しますか? 誰が恩恵を受けますか?
      placeholder: |
        親として、... したい
        子供ユーザーとして、... したい
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決策
      description: この機能がどのように動作してほしいか説明してください。
    validations:
      required: true

  - type: textarea
    id: goals
    attributes:
      label: ゴール（Acceptance Criteria）
      description: |
        この機能が完了したと判断できる条件を列挙する。
        AC は**測定可能な数値・文字列・ファイルパス**で書くこと（ADR-0004）。
        「〜が改善される」「UXが向上する」等の抽象表現は不可。
      value: |
        - [ ] <!-- 例: 「/ops/audit-log 画面に直近 10 分の検証失敗ログが表形式で表示される」 -->
        - [ ] <!-- 例: 「DynamoDB OpsAuditLog テーブルに action=LICENSE_VERIFY_FAIL のレコードが insert される」 -->
        - [ ] <!-- 例: 「Playwright E2E `tests/e2e/ops-audit.spec.ts` が新規追加され、全 assert が緑」 -->
    validations:
      required: true

  - type: textarea
    id: ac-verification-plan
    attributes:
      label: AC 検証計画（ADR-0004 必須）
      description: |
        上記ゴールの各 AC を**どの機械手段で検証するか**を列挙する。
        PR 作成時に「AC 検証マップ」として転記されるため、ここで曖昧だと PR も曖昧になる。
        ⚠️ 「目視確認」だけでは不可。コマンド・ファイルパス・期待文字列を書くこと。
      value: |
        <!-- 例:
        - AC1: Playwright (`tests/e2e/ops-audit.spec.ts`) で UI 要素 `getByTestId('audit-log-table')` を assert
        - AC2: `aws dynamodb query --table-name OpsAuditLog --index-name action-index ...` で 1 件以上ヒット
        - AC3: `cat tests/e2e/ops-audit.spec.ts | grep -c 'test('` が 1 以上
        -->
        - AC1: <!-- 検証手段 -->
        - AC2: <!-- 検証手段 -->
    validations:
      required: true

  - type: dropdown
    id: age-group
    attributes:
      label: 対象年齢モード
      description: どの年齢モードに最も関連しますか?
      options:
        - "baby (0-2歳)"
        - "preschool (3-5歳)"
        - "elementary (6-9歳)"
        - "junior (10-12歳)"
        - "senior (13-15歳)"
        - "全年齢共通"
        - "親/管理者向け"
        - "該当なし"

  - type: textarea
    id: ui-mockup
    attributes:
      label: UI イメージ / モックアップ
      description: 画面のイメージがあれば、ラフスケッチやモックアップを添付してください。

  - type: textarea
    id: auxiliary-feature-ux-checklist
    attributes:
      label: 機能完成度 checklist 9 層 17 項目（該当層のみ）
      description: |
        permission 系 5 / marketplace 系 4 / 子供向け機能 6 / ナビ・情報アーキテクチャ系 2 のうち、
        該当層の項目を AC に複製する。17 項目の本文 SSOT は
        `.claude/skills/issue-triage/SKILL.md` §手順 E（上位ポリシーは ADR-0010 §7）。
        「JSON + UI 表示のみ + import 未実装」状態での起票は禁止（ADR-0013 LP truth 違反）。
      placeholder: |
        該当層: marketplace 系 4 層 → AC に複製済
        または: N/A（permission / marketplace / 子供向け機能 / ナビ系ではない）
    validations:
      required: false

  - type: textarea
    id: oss-research
    attributes:
      label: OSS / 確立パターン調査結果（独自実装 10 行超時に必須、#1350）
      description: OSS / 確立パターンを 2 件以上調査し採用判断を残す。docs/fix/test 等の保守は「N/A」可。
      placeholder: |
        - 候補 A: <名前> — stars / bundle / 型推論。△ <弱点>
        - 候補 B: <名前> — <特徴>。△ <弱点>
        - 決定: A / Pre-PMF コスト (ADR-0010): <許容根拠>

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives + Prior art
      description: |
        検討した他案と不採用理由。Prior art（採用 OSS / 競合の同等機能）を含めること。
        該当が無い場合は「探した範囲」（どのキーワードで探し、なぜ該当がなかったか）を書く。
      placeholder: |
        - 案 A: 既存 hook を拡張 — 0 行追加 / 副作用増（不採用）
        - 案 B: 新規 service 層 — 単一責務 / 工数 +2h（採用）
        - Prior art: <OSS / 競合> の同等パターン
    validations:
      required: true

  - type: textarea
    id: no-gos
    attributes:
      label: No-gos / 今回スコープ外
      description: 今回意図的にスコープ外とする範囲（YAGNI 適用 / 将来 Issue 候補）。無い場合も「特になし」と明記する。
      placeholder: |
        - 既存 open Issue への retroactive 適用（新規のみ）
        - i18n 対応（別 Issue 候補）
    validations:
      required: true

  - type: textarea
    id: research-link
    attributes:
      label: research-link（Deep Research 結果リンク）
      description: OSS 比較 / 競合調査 / 学術参照の記録へのリンク。不要なら「N/A」+ 理由を明記する。
      placeholder: |
        - docs/reference/NN-research-<topic>.md §2.1
        - または: N/A（既存パターン適用のため新規調査不要）
    validations:
      required: true

  - type: textarea
    id: pre-pmf-check
    attributes:
      label: Pre-PMF check（ADR-0010 §3）
      description: |
        起票バイアスを防ぐため 5 質問に回答する。priority:critical bug fix / 法務・セキュリティは「免除」+ 理由で可。
      placeholder: |
        Q1 ペルソナ (P1/P2) とその課題:
        Q2 V2MOM Method (M1〜M4) 紐付け:
        Q3 この機能なしで サインアップ 20 名/月 に到達できるか (可→medium 以下 / 不可→high 以上 + 根拠):
        Q4 直近に Growth / Marketing / Onboarding 系 Issue を 1 本以上起票したか:
        Q5 工数と Year 1 KPI への寄与は釣り合うか:
    validations:
      required: true

  - type: textarea
    id: blocked_by
    attributes:
      label: Blocked by（上流依存）
      description: |
        この機能の実装を着手する前に完了すべき**上流 Issue 番号**を列挙する。
        未確定の企画・ADR・設計方針が上流にある場合はここに列挙し、それらが closed になるまで実装着手しない。
      placeholder: |
        #123 (ADR: Pre-PMF 判断基準)
        #456 (企画: 顧客範囲確定)

  - type: textarea
    id: blocks
    attributes:
      label: Blocks（下流への影響）
      description: |
        この機能完了後にアンブロックされる**下流 Issue 番号**を列挙する。
      placeholder: |
        #789 (設計: アーキテクチャ)
        #790 (実装: 画面)

  - type: textarea
    id: related
    attributes:
      label: Related（参考のみ・依存関係なし）
      description: "関連するが依存関係を持たない Issue / ADR / ドキュメントを列挙"
      placeholder: |
        #234 (類似実装の参考)
        ADR-0010

  - type: dropdown
    id: phase
    attributes:
      label: 工程区分（P0-P7 / N/A）
      description: 下流 Phase は上流が閉じるまで着手しない。複数該当時は最も上流を選ぶ（SSOT は .github/CLAUDE.md）。
      options:
        - "P0: インフラ・プロセス更改"
        - "P1: ポリシー・判断基準 (ADR)"
        - "P2: プロダクト定義・顧客範囲（企画）"
        - "P3: アーキテクチャ・技術選定 (ADR)"
        - "P4: 戦略・構造設計"
        - "P5: 実装・コンテンツ"
        - "P6: 機能実装"
        - "P7: バグ修正・クリーンアップ"
        - "N/A（独立タスク）"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 補足情報
      description: その他の情報、参考事例、スクリーンショットなど。
