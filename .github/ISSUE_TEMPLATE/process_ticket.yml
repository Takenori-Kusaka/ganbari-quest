name: プロセス・ドキュメント Issue（PO 起票系）
description: LP / マーケ / プロセス改善 / refactor-SSOT / docs 系の起票テンプレ。実装系は dev_ticket.yml
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        実装系 Issue（feat / fix / 新機能・新 API / DB スキーマ変更等）は [dev_ticket.yml](?template=dev_ticket.yml) を使ってください。

  - type: dropdown
    id: kind
    attributes:
      label: kind（PO 起票系 5 区分）
      options:
        - "refactor-SSOT: SSOT 整理・重複削除"
        - "docs: ドキュメント / ADR / 設計書"
        - "marketing: マーケ / Growth"
        - "process: プロセス改善 / CI / Issue テンプレ"
        - "lp-content: LP 文言 / IA"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      options:
        - "critical: 最優先"
        - "high: 高"
        - "medium: 中"
        - "low: 低"
    validations:
      required: true

  - type: textarea
    id: customer-value
    attributes:
      label: 顧客価値・目的
      description: 「なぜこの変更がユーザー / 運営 / 開発チームにとって必要か」を 1-2 文で。
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: 関連 Issue / ADR
      description: Blocked by / Blocks / Related の 3 分割（#1261）+ 関連 ADR
      placeholder: |
        - Blocked by: #123 / Blocks: #456 / Related: ADR-0003 / ADR-0010
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 設計背景
      description: 過去経緯 / この改善がなかった場合に何が困るか
    validations:
      required: true

  - type: textarea
    id: design-policy
    attributes:
      label: 設計方針
      description: 採用設計 / 将来拡張 / 意図的に対応しない範囲（YAGNI）
    validations:
      required: true

  - type: textarea
    id: auxiliary-feature-ux-checklist
    attributes:
      label: 機能完成度 checklist 9 層 17 項目（該当層のみ）
      description: |
        permission 系 5 / marketplace 系 4 / 子供向け機能 6 / ナビ・情報アーキテクチャ系 2 のうち、
        該当層の項目を AC に複製する。17 項目の本文 SSOT は
        `.claude/skills/issue-triage/SKILL.md` §手順 E（上位ポリシーは ADR-0010 §7）。
        「JSON + UI 表示のみ + import 未実装」状態での起票は禁止（ADR-0013 LP truth 違反）。
      placeholder: |
        該当層: marketplace 系 4 層 → AC に複製済
        または: N/A（permission / marketplace / 子供向け機能 / ナビ系ではない）
    validations:
      required: false

  - type: textarea
    id: oss-research
    attributes:
      label: OSS / 確立パターン調査結果（refactor-SSOT 時に必須、#1350）
      description: 10 行超独自実装は 2 件以上比較必須。lp-content / marketing / docs では N/A 可。

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives + Prior art
      description: |
        検討した他案と不採用理由。Prior art（採用 OSS / 競合の同等機能）を含めること。
        該当が無い場合は「探した範囲」（どのキーワードで探し、なぜ該当がなかったか）を書く。
      placeholder: |
        - 案 A: 既存 hook を拡張 — 0 行追加 / 副作用増（不採用）
        - 案 B: 新規 service 層 — 単一責務 / 工数 +2h（採用）
        - Prior art: <OSS / 競合> の同等パターン
    validations:
      required: true

  - type: textarea
    id: no-gos
    attributes:
      label: No-gos / 今回スコープ外
      description: 今回意図的にスコープ外とする範囲（YAGNI 適用 / 将来 Issue 候補）。無い場合も「特になし」と明記する。
      placeholder: |
        - 既存 open Issue への retroactive 適用（新規のみ）
        - i18n 対応（別 Issue 候補）
    validations:
      required: true

  - type: textarea
    id: research-link
    attributes:
      label: research-link（Deep Research 結果リンク）
      description: OSS 比較 / 競合調査 / 学術参照の記録へのリンク。不要なら「N/A」+ 理由を明記する。
      placeholder: |
        - docs/reference/NN-research-<topic>.md §2.1
        - または: N/A（既存パターン適用のため新規調査不要）
    validations:
      required: true

  - type: textarea
    id: pre-pmf-check
    attributes:
      label: Pre-PMF check（ADR-0010 §3）
      description: |
        起票バイアスを防ぐため 5 質問に回答する。priority:critical bug fix / 法務・セキュリティは「免除」+ 理由で可。
      placeholder: |
        Q1 ペルソナ (P1/P2) とその課題:
        Q2 V2MOM Method (M1〜M4) 紐付け:
        Q3 この機能なしで サインアップ 20 名/月 に到達できるか (可→medium 以下 / 不可→high 以上 + 根拠):
        Q4 直近に Growth / Marketing / Onboarding 系 Issue を 1 本以上起票したか:
        Q5 工数と Year 1 KPI への寄与は釣り合うか:
    validations:
      required: true

  - type: textarea
    id: goals
    attributes:
      label: ゴール（Acceptance Criteria）
      description: 測定可能な数値・文字列・ファイルパス・SS で書く（ADR-0004）。曖昧な「修正する」禁止。
      value: |
        - [ ] **AC1**: <!-- 測定可能な完了条件 -->
        - [ ] **AC2**:
    validations:
      required: true

  - type: textarea
    id: ac-verification-plan
    attributes:
      label: AC 検証計画（ADR-0004 必須）
      description: 各 AC をどの機械手段（コマンド / ファイルパス / 期待文字列）で検証するか。
      value: |
        - AC1: <!-- 例: `wc -l <file>` <= N -->
        - AC2:
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: 工程区分
      description: 下流 Phase は上流 Phase が閉じるまで着手しない。
      options:
        - "P0: インフラ・プロセス更改"
        - "P1: ポリシー・判断基準 (ADR)"
        - "P2: プロダクト定義・顧客範囲"
        - "N/A（独立タスク）"
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 影響範囲
      description: 変更ファイル / 影響を受ける運用 / dogfood 観察期間など。実装系の重い検証項目は本 template 対象外（dev_ticket.yml を使用）。

  - type: checkboxes
    id: done-checklist
    attributes:
      label: 完了チェックリスト
      options:
        - label: "AC 全項目 [x]（ADR-0005）"
        - label: "`npm run pre-ready -- --pr <num>` PASS（PR 系の場合）"
        - label: "GitHub Actions 全 green"
        - label: "dogfood 観察期間中の異常なし（Phase 2 を持つ Issue のみ）"
