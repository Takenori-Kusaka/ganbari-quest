version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # develop 二層: 依存更新 PR を develop 軽量レーン経由にし main 直行を止める
    # (#3072 / branch-strategy.md §7。main へは統合 PR の重量レーン + 監査で反映)
    target-branch: "develop"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    # develop 二層: 依存更新 PR を develop 軽量レーン経由にする (#3072 / branch-strategy.md §7)
    target-branch: "develop"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "npm"
    ignore:
      - dependency-name: "@types/*"
        update-types: ["version-update:semver-patch"]
      # #3302: better-sqlite3 12.11.x は demo/SQLite (file-backed + WAL) を SIGSEGV crash させる
      # (#3190/#3192 で 12.10.0 exact pin に根治)。upstream 修正確認まで 12.11.x を ignore。
      # #3940: 13.x は N-API 全面 rewrite (2026-07-21 リリース) を評価のうえ不採用 (12.10.0 維持) と判断。
      # smoke は #3190 SIGSEGV class を再現できない (gate 空洞化) ため CI green を採用根拠にできず、
      # EPIC #3424 (PGlite 一本化) で依存縮小方向のため実機検証投資も defer。#3937 close 済み。
      # 【再評価条件】13.1.x 以降 or 13.0.x の 1 ヶ月 soak + upstream WiseLibs/better-sqlite3#1503
      # (Windows install regression) close。解除時は本 ignore から "13.x" を外し、採用時は
      # scripts/check-native-dep-pin.mjs の pin と同期更新 (Issue #3940 再開手順参照)。
      - dependency-name: "better-sqlite3"
        versions: ["12.11.x", "13.x"]
      # #3636: typescript 7.x は @sveltejs/kit@2.69.x の peer (^5.3.3 || ^6.0.0) が除外し
      # npm ci が ERESOLVE で失敗する。kit が TS7 peer 対応版を出したら本 ignore を削除して TS7 を取り込む。
      # major (6→7) のみ保留し 6.x の minor/patch 更新は許可する。
      # 【解除手順 (#3765、2 手順必須)】@sveltejs/kit が peer に typescript@^7 を含む版を release したら:
      #   1. 本 ignore エントリ + 本コメントを削除する PR を出す (yml 側の抑止解除)
      #   2. 加えて dependabot に `@dependabot unignore typescript` を実行し、PR #3636 の
      #      `@dependabot ignore this major version` 由来の internal ignore も解除する。
      #      yml と comment 由来 ignore は独立した別々の抑止機構であり、yml 削除だけでは TS7 が再開されない。
      #   3. その後 @sveltejs/kit を TS7 対応版へ bump → dependabot が TS7 を再提案 (npm ci が通り mergeable)。
      #   ※ 解除前に @sveltejs/kit@2.x の peer が実際に typescript@^7 を含むか確認 (ERESOLVE 再発防止)。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        # #3311: grouped update が per-dependency ignore (上記 better-sqlite3 12.11.x) を
        # すり抜けて 12.11.1 を再取込した regression を根治。group 自体から除外し再発を断つ
        # (#3302 SIGSEGV regression guard / scripts/check-native-dep-pin.mjs と同期)。
        exclude-patterns:
          - "better-sqlite3"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/infra"
    # develop 二層: 依存更新 PR を develop 軽量レーン経由にする (#3072 / branch-strategy.md §7)
    target-branch: "develop"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "npm"
      - "infra"
    groups:
      infra-npm-minor-patch:
        update-types:
          - "minor"
          - "patch"


  # #4866: graphify-refresh.yml が hash pin で入れる python 依存 30 件について。
  #
  # **意図的に `updates:` entry を置いていない。** pin list は
  # `.github/graphify/requirements.txt` に実ファイルとして出してあり、GitHub の
  # dependency graph は file 名 `requirements.txt` で拾うので、**CVE の alert は届く**
  # (workflow の heredoc に埋めていた間はそれすら届かなかった、というのが元の欠陥)。
  #
  # 一方で version update を有効にすると害がある (#4866 adversarial 実測):
  #   - `.in` の兄弟を持たない `.txt` は閉包解決をしない resolver で扱われるため、
  #     Dependabot は `tree-sitter` 0.26.0 を提案する。graphifyy 0.9.32 は
  #     `tree-sitter<0.26` を要求するので `ResolutionImpossible` になる
  #     (最新の graphifyy 0.9.56 も `<0.26` のままなので逃げ道が無い)
  #   - CI にこの file を install する job は無く、`graphify-refresh` 自身も
  #     `ref: develop` を固定 checkout するので **Dependabot の PR branch を検証できない**
  #     = 全 check 緑のまま merge され、develop 上で初めて落ちて graph が stale 化する
  #
  # **security update は別経路で来る** (adversarial round 5 実測)。
  # `automated-security-fixes` は repo 設定側で enabled で、`updates:` entry を必要としない。
  # しかも security 経路は `target-branch` を無視して default branch (main) に直行する
  # (`ci.yml` の `main-pr-base-guard` が仕様として明記)。
  #
  # 実績は **`target-branch: develop` を入れた 2026-06-17 以降**だけを数える。全期間 163 件
  # (develop 60 / main 103) で数えると、設定が無かった時期の main 直行まで security 経路の
  # 証拠に見えてしまう。以降に作られた Dependabot PR は 70 件で **develop 60 / main 10**。
  # main 側 10 件の内訳 (PR body の「automated security fix PRs」footer で判別):
  #   - security 経路 6 件 = #3159 / #3160 / #3161 / #4478 / #4479 / #4532
  #   - version update 4 件 = #3155-#3158 (どれも 2026-06-19。設定が default branch に届く前)
  # **2026-06-19 以降に main へ来たのは security 経路の 3 件だけ** (#4478 / #4479 / #4532)。
  # つまり **CVE が出れば bump PR は来る** — ここで閉じているのは定期の version update だけ。
  # その PR の見方は `.github/workflows/graphify-refresh.yml` の Install step のコメント。
  #
  # 版を上げるときは workflow のコメントにある手順で、report が出した集合ごと置き換える。
