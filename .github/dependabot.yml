version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # develop 二層: 依存更新 PR を develop 軽量レーン経由にし main 直行を止める
    # (#3072 / branch-strategy.md §7。main へは統合 PR の重量レーン + 監査で反映)
    target-branch: "develop"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    # develop 二層: 依存更新 PR を develop 軽量レーン経由にする (#3072 / branch-strategy.md §7)
    target-branch: "develop"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "npm"
    ignore:
      - dependency-name: "@types/*"
        update-types: ["version-update:semver-patch"]
      # #3302: better-sqlite3 12.11.x は demo/SQLite (file-backed + WAL) を SIGSEGV crash させる
      # (#3190/#3192 で 12.10.0 exact pin に根治)。upstream 修正確認まで 12.11.x を ignore。
      # #3940: 13.x は N-API 全面 rewrite (2026-07-21 リリース) を評価のうえ不採用 (12.10.0 維持) と判断。
      # smoke は #3190 SIGSEGV class を再現できない (gate 空洞化) ため CI green を採用根拠にできず、
      # EPIC #3424 (PGlite 一本化) で依存縮小方向のため実機検証投資も defer。#3937 close 済み。
      # 【再評価条件】13.1.x 以降 or 13.0.x の 1 ヶ月 soak + upstream WiseLibs/better-sqlite3#1503
      # (Windows install regression) close。解除時は本 ignore から "13.x" を外し、採用時は
      # scripts/check-native-dep-pin.mjs の pin と同期更新 (Issue #3940 再開手順参照)。
      - dependency-name: "better-sqlite3"
        versions: ["12.11.x", "13.x"]
      # #3636: typescript 7.x は @sveltejs/kit@2.69.x の peer (^5.3.3 || ^6.0.0) が除外し
      # npm ci が ERESOLVE で失敗する。kit が TS7 peer 対応版を出したら本 ignore を削除して TS7 を取り込む。
      # major (6→7) のみ保留し 6.x の minor/patch 更新は許可する。
      # 【解除手順 (#3765、2 手順必須)】@sveltejs/kit が peer に typescript@^7 を含む版を release したら:
      #   1. 本 ignore エントリ + 本コメントを削除する PR を出す (yml 側の抑止解除)
      #   2. 加えて dependabot に `@dependabot unignore typescript` を実行し、PR #3636 の
      #      `@dependabot ignore this major version` 由来の internal ignore も解除する。
      #      yml と comment 由来 ignore は独立した別々の抑止機構であり、yml 削除だけでは TS7 が再開されない。
      #   3. その後 @sveltejs/kit を TS7 対応版へ bump → dependabot が TS7 を再提案 (npm ci が通り mergeable)。
      #   ※ 解除前に @sveltejs/kit@2.x の peer が実際に typescript@^7 を含むか確認 (ERESOLVE 再発防止)。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        # #3311: grouped update が per-dependency ignore (上記 better-sqlite3 12.11.x) を
        # すり抜けて 12.11.1 を再取込した regression を根治。group 自体から除外し再発を断つ
        # (#3302 SIGSEGV regression guard / scripts/check-native-dep-pin.mjs と同期)。
        exclude-patterns:
          - "better-sqlite3"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/infra"
    # develop 二層: 依存更新 PR を develop 軽量レーン経由にする (#3072 / branch-strategy.md §7)
    target-branch: "develop"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "npm"
      - "infra"
    ignore:
      # #4017 / PR #4422: aws-cdk-lib 2.263.0 以降は bundled brace-expansion を 5.0.8 に上げる。
      # 5.0.8 は GHSA-rgw5-rvv9-x895 (affected ">= 4.0.0, < 5.0.9" / patched 5.0.9) の affected で、
      # bundled dependency (inBundle: true) のため npm overrides では差し替えられない (実測確認済)。
      # 留めないと dependency-review が毎回赤になり、そのたびに同じ調査と手動 pin を繰り返す。
      # 【解除条件】aws-cdk-lib が brace-expansion 5.0.9 以上を同梱した版を出したら、本 ignore と
      #   下の exclude-patterns、.github/workflows/dependency-review.yml の waiver / 受容記録、
      #   tests/unit/infra/dependency-review-waiver.test.ts を同じ PR で削除する。
      #   到達検知は同 test の [W5] が機械的に行う (bundled が 5.0.9 以上になったら撤去を要求する)。
      # 【コスト】2.263.0 の cloudformation-validate 更新 (aws/aws-cdk#38444) 等、この間の
      #   aws-cdk-lib 改善は取り込めない。CDK CLI (aws-cdk) / constructs の更新は止めていない。
      - dependency-name: "aws-cdk-lib"
        versions: [">= 2.263.0"]
    groups:
      infra-npm-minor-patch:
        # #3311 と同じ理由: grouped update は per-dependency ignore をすり抜けて再取込する。
        # 上の ignore を実効化するため group からも除外する (解除時は ignore と同時に消す)。
        exclude-patterns:
          - "aws-cdk-lib"
        update-types:
          - "minor"
          - "patch"
