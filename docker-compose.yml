services:
  app:
    build:
      context: .
      args:
        # Cache-busting arg (#711 / PR #826 review):
        # Pass BUILD_TIMESTAMP=<unique value> from deploy workflow to force
        # version:generate to re-run even when the source layer cache hits.
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-unknown}
        # NUC LAN: 同一ネットワーク内の任意端末からの POST を許可 (#962)
        DISABLE_CSRF_ORIGIN_CHECK: "true"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # 稼働中の DB (PGlite / SQLite) は **必ずローカルディスク**に置く。
      # 埋め込み型 DB をネットワーク共有上で直接稼働させると、書き込み中の切断で
      # DB ファイルが破損する (既知の危険パターン)。ここは差し替え可能にしない。
      - ./data:/app/data
      # #3970: **バックアップだけ**を compose を書き換えずに差し替えられるようにする。
      # 既定は従来どおり ./data/backups。NAS / SAMBA マウント等へ向けたい場合は .env で
      # HOST_BACKUP_DIR=/mnt/nas/ganbari-quest-backups のように指定する。
      # off-site 複製そのものはファイルシステム層 (運用者の責任) で行う — 詳細は
      # docs/runbooks/pglite-restore-drill.md §オフサイト複製。
      - ${HOST_BACKUP_DIR:-./data/backups}:/app/backups
      - ./tenants:/app/client/tenants
      - ./uploads:/app/client/uploads
      - ./generated:/app/client/generated
    environment:
      - NODE_ENV=production
      - DATABASE_URL=./data/ganbari-quest.db
      # #3950: PGlite バックアップはアプリプロセス内で採るため、取得先と保持世代は app 側が読む
      # (backup コンテナは /api/cron/pglite-backup を叩くだけ)。保持 3 世代 = オーナー決裁。
      - BACKUP_DIR=/app/backups
      - BACKUP_RETENTION=3
      - HOST=0.0.0.0
      - PORT=3000
      - ORIGIN=${ORIGIN:-http://localhost:3000}
      - TZ=Asia/Tokyo
    env_file:
      - path: .env
        required: false
    stop_grace_period: 15s
    restart: unless-stopped

  # Scheduled backup service (runs daily at 3:00 AM JST)
  # Enable: docker compose --profile backup up -d
  #
  # #2519: backup → restore 検証を chain する。backup の「存在」だけでなく
  # 「restore 可能 + 中身が壊れていない」を毎日確認し、verify 失敗時は Discord alert を送る
  # (DISCORD_ALERT_WEBHOOK_URL)。GDrive アップロードは BACKUP_POST_HOOK (.env) 経由。
  #
  # #3950: 入口を scripts/backup-nuc.cjs に一本化した。DATA_SOURCE を見て backend ごとの経路へ
  # 振り分ける (pglite = アプリの /api/cron/pglite-backup、それ以外 = 従来の SQLite 経路)。
  # 直接 backup-db.cjs を叩いていた旧構成は、2026-07-12 の PGlite 移行後も旧 SQLite を複製し続け、
  # **実データが 2 週間以上無保護のまま毎日 fail していた** (#3950)。backend 判定を 1 箇所に集約する。
  backup:
    build: .
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "0 3 * * * cd /app && node scripts/backup-nuc.cjs >> /proc/1/fd/1 2>&1" | crontab -
        echo "[Backup] Cron scheduled: daily 3:00 AM JST (backup-nuc: backend 振り分け + 復元検証)"
        crond -f
    # backup コンテナは web server を持たないため Dockerfile の HEALTHCHECK
    # (wget :3000/health) を継承すると恒久的に unhealthy 誤表示になる (#2985)。
    # crond プロセスの稼働を確認する専用 healthcheck で上書きする。
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond > /dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
    volumes:
      # DB はローカル固定 (app と同じ理由)。backup コンテナは PGlite を直接開かないが、
      # SQLite 経路 (backup-db.cjs) は /app/data を読むため mount は必要。
      - ./data:/app/data
      # #3970: app と同じ実体を指すこと。片方だけ差し替えると backup コンテナが
      # 別ディレクトリを見て「取れているのに実データではない」#3950 同型になる。
      - ${HOST_BACKUP_DIR:-./data/backups}:/app/backups
      - ./scripts:/app/scripts:ro
    environment:
      - DATABASE_URL=./data/ganbari-quest.db
      - BACKUP_DIR=/app/backups
      # #3950: 保持世代はオーナー決裁 (2026-07-26) で日次 3 世代。
      # BACKUP_RETENTION は pglite 経路ではアプリ側 (app サービス) が読むため、両方に設定する。
      - BACKUP_RETENTION=3
      # DATA_SOURCE / CRON_SECRET は .env から供給される (env_file required: true)。
      # backup コンテナは app に HTTP で backup 起動を依頼するため APP_URL が必要。
      - APP_URL=http://app:3000
      - TZ=Asia/Tokyo
    env_file:
      - path: .env
        required: true
    restart: unless-stopped
    profiles:
      - backup

  # Cron scheduler service (#1375: NUC 統一スケジューラ)
  # Enable: docker compose --profile scheduler up -d
  # CRON_SECRET must be set in .env before enabling.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    environment:
      - APP_URL=http://app:3000
      - TZ=Asia/Tokyo
    env_file:
      - path: .env
        required: false
    depends_on:
      - app
    restart: unless-stopped
    profiles:
      - scheduler

  # Optional: Caddy reverse proxy for HTTPS
  # Uncomment and create a Caddyfile to enable
  # caddy:
  #   image: caddy:2-alpine
  #   ports:
  #     - "443:443"
  #     - "80:80"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile
  #     - caddy-data:/data
  #   depends_on:
  #     - app

